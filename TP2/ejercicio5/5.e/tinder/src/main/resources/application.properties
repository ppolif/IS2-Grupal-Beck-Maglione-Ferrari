spring.security.oauth2.client.registration.auth0.client-id=Vb31YSHwqw4QNtyMV4SSasBuNK4Haea2
spring.security.oauth2.client.registration.auth0.client-secret=_Py8SDJhgtSXuta3FxlWOGtyCoARqHJGIxfRTBiyRbpCNeyGbC8e6gQKR4KY8mbz
spring.security.oauth2.client.registration.auth0.scope=openid,profile,email
spring.security.oauth2.client.registration.auth0.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.auth0.client-authentication-method=client_secret_post

# IMPORTANTE: La barra "/" al final de issuer-uri es obligatoria en Auth0 porque el claim "iss" del token la incluye
spring.security.oauth2.client.provider.auth0.issuer-uri=https://dev-28ksfq3b24zrctsw.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-28ksfq3b24zrctsw.us.auth0.com/

# NUEVO: Identificador único (Audience) de la API que creamos en el panel de Auth0.
# Se usa tanto para pedirle a Auth0 que emita un Access Token en formato JWT al loguearse,
# como para validar en el servidor (Resource Server) que el token pertenece a esta API.
auth0.audience=https://api.tinder.com

