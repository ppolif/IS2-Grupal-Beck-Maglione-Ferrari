<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="alerts" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4">
    <!-- Mensaje de Éxito -->
    <div th:if="${exito != null}" class="bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl flex items-center justify-between mb-4 shadow-sm animate-fade-in">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i>
            <span th:text="${exito}" class="text-sm font-medium"></span>
        </div>
        <button onclick="this.parentElement.remove()" class="text-emerald-500 hover:text-emerald-700">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- Mensaje de Error -->
    <div th:if="${error != null}" class="bg-rose-50 border border-rose-200 text-rose-800 px-4 py-3 rounded-xl flex items-center justify-between mb-4 shadow-sm animate-fade-in">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-circle-exclamation text-rose-500 text-lg"></i>
            <span th:text="${error}" class="text-sm font-medium"></span>
        </div>
        <button onclick="this.parentElement.remove()" class="text-rose-500 hover:text-rose-700">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
</div>
</body>
</html>
