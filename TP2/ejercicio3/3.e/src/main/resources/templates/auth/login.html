<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar Sesión')}"></head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <div>
        <header th:replace="~{fragments/navbar :: navbar}"></header>
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <main class="max-w-md mx-auto px-4 py-16">
            <div class="bg-white rounded-3xl border border-slate-200/80 shadow-md p-8 sm:p-10">
                
                <div class="text-center mb-8">
                    <span class="w-12 h-12 bg-rose-50 text-bloom-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <h1 class="font-serif-title text-2xl font-bold text-slate-800">Iniciar Sesión</h1>
                    <p class="text-xs text-slate-500 mt-1">Accede a tu carrito de compras e historial personal (HU2)</p>
                </div>

                <form th:action="@{/login}" method="post" class="space-y-4">
                    <div>
                        <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required placeholder="cliente@bloomshop.com"
                               class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-bloom-500 focus:outline-none">
                    </div>

                    <div>
                        <label for="clave" class="block text-xs font-semibold text-slate-700 mb-1">Contraseña</label>
                        <input type="password" id="clave" name="clave" required placeholder="••••••••"
                               class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-bloom-500 focus:outline-none">
                    </div>

                    <button type="submit"
                            class="w-full bg-bloom-600 hover:bg-bloom-700 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-md shadow-rose-200 transition">
                        Ingresar a Mi Cuenta
                    </button>
                </form>

                <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                    <p class="text-xs text-slate-500">
                        ¿No tienes una cuenta aún?
                        <a th:href="@{/registro}" class="text-bloom-600 font-bold hover:underline">Regístrate aquí</a>
                    </p>
                </div>

                <div class="mt-4 bg-slate-50 p-3 rounded-xl border border-slate-100 text-[11px] text-slate-500">
                    <p><strong>Cuentas demo listas:</strong></p>
                    <p>• admin@bloomshop.com / admin123</p>
                    <p>• cliente@bloomshop.com / cliente123</p>
                </div>

            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
