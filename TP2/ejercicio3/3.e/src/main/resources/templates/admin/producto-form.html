<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Alta de Artículo (HU7)')}"></head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <div>
        <header th:replace="~{fragments/navbar :: navbar}"></header>
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <main class="max-w-2xl mx-auto px-4 py-12">
            
            <div class="mb-8">
                <span class="text-xs uppercase font-bold tracking-widest text-bloom-600 bg-rose-50 px-3 py-1 rounded-full">
                    Panel Administrador
                </span>
                <h1 class="font-serif-title text-3xl font-bold text-slate-800 mt-2">Alta de Artículo (HU7)</h1>
                <p class="text-xs text-slate-500">Registrar un nuevo producto para publicarlo y venderlo en la tienda.</p>
            </div>

            <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 sm:p-10">
                <form th:action="@{/admin/articulos/nuevo}" method="post" enctype="multipart/form-data" class="space-y-5">
                    
                    <div>
                        <label for="nombre" class="block text-xs font-semibold text-slate-700 mb-1">Nombre del Artículo / Flor *</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ej. Lirios de los Alpes"
                               class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-bloom-500 focus:outline-none">
                    </div>

                    <div>
                        <label for="precio" class="block text-xs font-semibold text-slate-700 mb-1">Precio Unitario ($) *</label>
                        <input type="number" id="precio" name="precio" step="0.01" min="0.01" required placeholder="15000.00"
                               class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-bloom-500 focus:outline-none">
                        <span class="text-[11px] text-slate-400 mt-1 block">Debe ser un valor numérico mayor a cero.</span>
                    </div>

                    <div>
                        <label for="proveedorId" class="block text-xs font-semibold text-slate-700 mb-1">Proveedor Asociado *</label>
                        <select id="proveedorId" name="proveedorId" required
                                class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-bloom-500 focus:outline-none">
                            <option value="">-- Seleccione un proveedor activo --</option>
                            <option th:each="prov : ${proveedores}" th:value="${prov.id}" th:text="${prov.nombre}"></option>
                        </select>
                        <div class="mt-1 flex justify-between text-[11px]">
                            <span class="text-slate-400">Solo proveedores activos.</span>
                            <a th:href="@{/admin/proveedores/nuevo}" class="text-bloom-600 font-semibold hover:underline">+ Crear nuevo proveedor</a>
                        </div>
                    </div>

                    <div>
                        <label for="archivoImagen" class="block text-xs font-semibold text-slate-700 mb-1">Imagen del Producto (Opcional)</label>
                        <input type="file" id="archivoImagen" name="archivoImagen" accept="image/*"
                               class="w-full px-4 py-2 border border-slate-200 rounded-xl text-xs file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-bloom-50 file:text-bloom-700 hover:file:bg-bloom-100">
                        <span class="text-[11px] text-slate-400 mt-1 block">Formatos admitidos: PNG, JPG, WEBP, SVG (hasta 10MB). Se persistirá en la entidad Imagen.</span>
                    </div>

                    <button type="submit"
                            class="w-full bg-bloom-600 hover:bg-bloom-700 text-white font-bold py-3.5 px-4 rounded-xl text-xs shadow-md shadow-rose-200 transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>Publicar Artículo</span>
                    </button>

                </form>
            </div>

        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
