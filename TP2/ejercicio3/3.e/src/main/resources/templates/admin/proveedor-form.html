<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Alta de Proveedor (HU6)')}"></head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <div>
        <header th:replace="~{fragments/navbar :: navbar}"></header>
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <main class="max-w-4xl mx-auto px-4 py-12">
            
            <div class="mb-8">
                <span class="text-xs uppercase font-bold tracking-widest text-bloom-600 bg-rose-50 px-3 py-1 rounded-full">
                    Panel Administrador
                </span>
                <h1 class="font-serif-title text-3xl font-bold text-slate-800 mt-2">Alta de Proveedor (HU6)</h1>
                <p class="text-xs text-slate-500">Registrar un nuevo proveedor para abastecer artículos al catálogo.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                
                <!-- Formulario Alta (HU6) -->
                <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 sm:p-8">
                    <h2 class="text-sm font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center space-x-2">
                        <i class="fa-solid fa-truck-field text-bloom-500"></i>
                        <span>Datos del Proveedor</span>
                    </h2>

                    <form th:action="@{/admin/proveedores/nuevo}" method="post" class="space-y-4">
                        <div>
                            <label for="nombre" class="block text-xs font-semibold text-slate-700 mb-1">Nombre de la Empresa o Vivero *</label>
                            <input type="text" id="nombre" name="nombre" required placeholder="Ej. Orquídeas del Litoral S.A."
                                   class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-bloom-500 focus:outline-none">
                            <span class="text-[11px] text-slate-400 mt-1 block">Se valida que no esté vacío y no se encuentre duplicado en la base de datos.</span>
                        </div>

                        <button type="submit"
                                class="w-full bg-bloom-600 hover:bg-bloom-700 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-md shadow-rose-200 transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span>Guardar Proveedor</span>
                        </button>
                    </form>
                </div>

                <!-- Lista de Proveedores Activos -->
                <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 sm:p-8">
                    <h2 class="text-sm font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center justify-between">
                        <span>Proveedores Activos</span>
                        <span class="text-xs text-slate-400" th:text="${#lists.size(proveedores)} + ' registrados'"></span>
                    </h2>

                    <div class="divide-y divide-slate-100 max-h-72 overflow-y-auto text-xs">
                        <div th:each="prov : ${proveedores}" class="py-3 flex justify-between items-center">
                            <div>
                                <span class="font-bold text-slate-800 block" th:text="${prov.nombre}"></span>
                                <span class="text-[10px] text-slate-400" th:text="'ID: ' + ${#strings.substring(prov.id, 0, 8)}"></span>
                            </div>
                            <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full">Activo</span>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
