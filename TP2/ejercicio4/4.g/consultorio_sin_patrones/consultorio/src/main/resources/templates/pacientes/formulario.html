<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${titleEdit})}"></head>
<body>
    <div id="app">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div id="main">
            <header class="mb-3">
                <div th:replace="~{fragments/navbar :: navbar}"></div>
            </header>

            <div class="page-heading">
                <h3 th:text="${titleEdit}">Formulario de Paciente</h3>
            </div>

            <div class="page-content">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="card shadow-sm">
                    <div class="card-header">
                        <h4 class="card-title">Datos del Paciente</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/pacientes/guardar}" th:object="${item}" method="POST" enctype="multipart/form-data">
                            <input type="hidden" th:field="*{id}">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label font-bold">DNI *</label>
                                    <input type="text" th:field="*{dni}" class="form-control" placeholder="Ej: 38123456" required th:disabled="${isDisabled}">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label font-bold">Foto del Paciente</label>
                                    <input type="file" name="archivoFoto" accept="image/*" class="form-control" th:disabled="${isDisabled}">
                                    <small class="text-muted">Formatos permitidos: JPG, PNG. Máx: 5MB.</small>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label font-bold">Nombre *</label>
                                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre de pila" required th:disabled="${isDisabled}">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label font-bold">Apellido *</label>
                                    <input type="text" th:field="*{apellido}" class="form-control" placeholder="Apellido" required th:disabled="${isDisabled}">
                                </div>
                            </div>

                            <div class="mt-4 d-flex gap-2">
                                <button type="submit" class="btn btn-primary shadow-sm" th:if="${isDisabled == null or !isDisabled}">
                                    <i class="bi bi-save me-1"></i> Guardar Paciente
                                </button>
                                <a th:href="@{/pacientes/list}" class="btn btn-light-secondary shadow-sm">
                                    <i class="bi bi-arrow-left me-1"></i> Volver
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <footer th:replace="~{fragments/footer :: footer}"></footer>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
