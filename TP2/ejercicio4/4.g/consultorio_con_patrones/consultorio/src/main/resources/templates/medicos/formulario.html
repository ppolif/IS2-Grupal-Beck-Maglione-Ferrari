<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${titleEdit})}"></head>
<body>
    <div id="app">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div id="main">
            <header class="mb-3">
                <div th:replace="~{fragments/navbar :: navbar}"></div>
            </header>

            <div class="page-heading">
                <h3 th:text="${titleEdit}">Formulario de Médico</h3>
            </div>

            <div class="page-content">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="card shadow-sm">
                    <div class="card-header">
                        <h4 class="card-title">Datos del Profesional</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/medicos/guardar}" th:object="${item}" method="POST">
                            <input type="hidden" th:field="*{id}">

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label font-bold">DNI *</label>
                                    <input type="text" th:field="*{dni}" class="form-control" placeholder="Ej: 25123456" required th:disabled="${isDisabled}">
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label font-bold">Nombre *</label>
                                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre de pila" required th:disabled="${isDisabled}">
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label font-bold">Apellido *</label>
                                    <input type="text" th:field="*{apellido}" class="form-control" placeholder="Apellido" required th:disabled="${isDisabled}">
                                </div>
                            </div>

                            <div class="mt-4 d-flex gap-2">
                                <button type="submit" class="btn btn-primary shadow-sm" th:if="${isDisabled == null or !isDisabled}">
                                    <i class="bi bi-save me-1"></i> Guardar Médico
                                </button>
                                <a th:href="@{/medicos/list}" class="btn btn-light-secondary shadow-sm">
                                    <i class="bi bi-arrow-left me-1"></i> Volver
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <footer th:replace="~{fragments/footer :: footer}"></footer>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
