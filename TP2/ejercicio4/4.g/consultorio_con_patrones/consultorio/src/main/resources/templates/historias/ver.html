<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Historial Clínico')}"></head>
<body>
    <div id="app">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div id="main">
            <header class="mb-3">
                <div th:replace="~{fragments/navbar :: navbar}"></div>
            </header>

            <div class="page-heading d-flex justify-content-between align-items-center">
                <div>
                    <h3>Historia Clínica</h3>
                    <p class="text-subtitle text-muted mb-0">Evolución y registro cronológico de consultas médicas.</p>
                </div>
                <a th:href="@{/historias/list}" class="btn btn-light-secondary shadow-sm">
                    <i class="bi bi-arrow-left me-1"></i> Volver a Historias
                </a>
            </div>

            <div class="page-content">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <!-- Tarjeta con Información del Paciente -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="me-3">
                                <img th:src="@{/foto/paciente/{id}(id=${historia.paciente.id})}"
                                     class="rounded-circle shadow-sm"
                                     style="width: 70px; height: 70px; object-fit: cover;"
                                     onerror="this.onerror=null; this.src='/assets/images/faces/1.jpg';"
                                     alt="Foto Paciente">
                            </div>
                            <div>
                                <h4 class="mb-1" th:text="${historia.paciente.apellido + ', ' + historia.paciente.nombre}"></h4>
                                <p class="text-muted mb-0">
                                    <span class="badge bg-primary me-2">DNI: <span th:text="${historia.paciente.dni}"></span></span>
                                    <span>Historia Clínica N°: <code th:text="${historia.id}"></code></span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Listado de Detalles Clínicos (Timeline) -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-light">
                        <h4 class="card-title mb-0"><i class="bi bi-clock-history me-2"></i>Evolución y Consultas Médicas</h4>
                    </div>
                    <div class="card-body pt-4">
                        <div th:each="det : ${historia.detalles}" th:if="${!det.eliminado}" class="border-start border-3 border-primary ps-3 mb-4 pb-2">
                            <div class="d-flex justify-content-between align-items-center flex-wrap">
                                <div>
                                    <h6 class="text-primary mb-1">
                                        <i class="bi bi-calendar3 me-1"></i>
                                        <span th:text="${#dates.format(det.fechaHistoria, 'dd/MM/yyyy HH:mm')}"></span>
                                    </h6>
                                    <span class="badge bg-light-secondary text-dark" th:if="${det.medico != null}">
                                        <i class="bi bi-person-fill me-1"></i>Dr/a: <span th:text="${det.medico.apellido + ', ' + det.medico.nombre}"></span>
                                    </span>
                                </div>
                                <div>
                                    <a th:href="@{/historias/{id}/eliminar-detalle/{detId}(id=${historia.id}, detId=${det.id})}"
                                       class="btn btn-sm btn-outline-danger shadow-sm"
                                       title="Eliminar este detalle por error de carga"
                                       onclick="return confirm('¿Confirma que desea eliminar este detalle clínico por error de carga? (Se realizará una baja lógica)');">
                                        <i class="bi bi-trash"></i> Eliminar Detalle
                                    </a>
                                </div>
                            </div>
                            <div class="mt-2 bg-light p-3 rounded text-dark">
                                <p class="mb-0" style="white-space: pre-line;" th:text="${det.detalleHistoria}"></p>
                            </div>
                        </div>

                        <div th:if="${#lists.isEmpty(historia.detalles)}" class="text-center text-muted py-3">
                            <p class="mb-0">No hay detalles registrados en esta historia clínica.</p>
                        </div>
                    </div>
                </div>

                <!-- Formulario para Agregar Nuevo Detalle -->
                <div class="card shadow-sm border border-primary">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title text-white mb-0"><i class="bi bi-plus-circle me-2"></i>Añadir Nuevo Detalle a la Historia</h5>
                    </div>
                    <div class="card-body pt-3">
                        <form th:action="@{/historias/{id}/agregar-detalle(id=${historia.id})}" method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label font-bold">Médico que atiende *</label>
                                    <select name="medicoId" class="form-select" required>
                                        <option value="">-- Seleccione médico --</option>
                                        <option th:each="m : ${medicos}" th:value="${m.id}" th:text="${m.apellido + ', ' + m.nombre + ' (DNI: ' + m.dni + ')'}"></option>
                                    </select>
                                </div>

                                <div class="col-12 mb-3">
                                    <label class="form-label font-bold">Informe de Consulta / Nueva Entrada *</label>
                                    <textarea name="detalleHistoria" class="form-control" rows="4" placeholder="Ingrese los nuevos hallazgos, tratamiento, indicaciones o evolución del paciente..." required></textarea>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success shadow-sm">
                                <i class="bi bi-plus-lg me-1"></i> Agregar a la Historia Clínica
                            </button>
                        </form>
                    </div>
                </div>

            </div>

            <footer th:replace="~{fragments/footer :: footer}"></footer>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
