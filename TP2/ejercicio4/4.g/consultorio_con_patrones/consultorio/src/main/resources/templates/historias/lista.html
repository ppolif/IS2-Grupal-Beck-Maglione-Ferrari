<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Historias Clínicas')}"></head>
<body>
    <div id="app">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div id="main">
            <header class="mb-3">
                <div th:replace="~{fragments/navbar :: navbar}"></div>
            </header>

            <div class="page-heading d-flex justify-content-between align-items-center">
                <h3>Historias Clínicas</h3>
                <a th:href="@{/historias/registrar}" class="btn btn-primary shadow-sm">
                    <i class="bi bi-folder-plus me-1"></i> Abrir Historia Clínica
                </a>
            </div>

            <div class="page-content">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="card-title">Pacientes con Historia Clínica Registrada</h4>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Paciente</th>
                                        <th>DNI</th>
                                        <th>Registrado por</th>
                                        <th class="text-center" style="width: 240px;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="h : ${historias}">
                                        <td>
                                            <strong th:text="${h.paciente.apellido + ', ' + h.paciente.nombre}"></strong>
                                        </td>
                                        <td><span class="badge bg-light-primary text-primary" th:text="${h.paciente.dni}"></span></td>
                                        <td th:text="${h.usuario != null ? h.usuario.nombreUsuario : 'Sistema'}"></td>
                                        <td class="text-center">
                                            <div class="d-flex justify-content-center gap-1">
                                                <a th:href="@{/historias/ver/{id}(id=${h.id})}" class="btn btn-sm btn-info text-white shadow-sm">
                                                    <i class="bi bi-eye-fill me-1"></i> Ver Historial
                                                </a>
                                                <a th:href="@{/historias/{id}/exportar(id=${h.id}, formato='txt')}" class="btn btn-sm btn-outline-secondary shadow-sm" title="Exportar en formato TXT">
                                                    <i class="bi bi-file-earmark-text"></i> TXT
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(historias)}">
                                        <td colspan="4" class="text-center text-muted py-4">
                                            <i class="bi bi-folder2-open fs-3 d-block mb-2"></i>
                                            No hay historias clínicas registradas aún.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <footer th:replace="~{fragments/footer :: footer}"></footer>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
