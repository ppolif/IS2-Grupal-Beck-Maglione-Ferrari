<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/css/pages/error.css}">
</head>
<body>
    <div id="error">
        <div class="error-page container">
            <div class="col-md-8 col-12 offset-md-2">
                <img class="img-error" th:src="@{/assets/images/samples/error-404.png}" alt="Página no encontrada">
                <div class="text-center">
                    <h1 class="error-title">Página no encontrada</h1>
                    <p class='fs-5 text-gray-600'>La página a la que intentas acceder no existe.</p>
                    <a th:href="@{/pacientes/list}" class="btn btn-lg btn-outline-primary mt-3">Volver al Inicio</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
