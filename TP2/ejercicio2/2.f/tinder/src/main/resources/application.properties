spring.application.name=tinder

# Nueva base de datos para la API REST sin conflicto con el tinder anterior
spring.datasource.url=jdbc:mysql://localhost:3306/tinder_rest?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234

server.port=9000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuraciones para respuestas de error de API REST
server.error.include-message=always
server.error.include-binding-errors=always

# Multipart configuration (soporte para subida de fotos hasta 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
