<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shop/fragments/head :: shop-head(title=${product != null && product.name != null} ? ${product.name} + ' - Zero Sportswear' : 'Detalle de Producto - Zero')}">
  <meta charset="UTF-8">
  <title>Detalle de Producto - Zero</title>
</head>
<body>

<!-- Header Fragment -->
<header th:replace="~{shop/fragments/header :: shop-header(activePage='category')}"></header>

<!-- Banner Fragment -->
<section th:replace="~{shop/fragments/banner :: shop-banner(title='Detalle del Producto', subtitle=${product != null && product.name != null ? product.name : 'Producto'})}"></section>

<!--================Single Product Area =================-->
<div class="product_image_area">
  <div class="container">
    <div class="row s_product_inner">
      <div class="col-lg-6">
        <div class="s_Product_carousel">
          <div class="single-prd-item">
            <img class="img-fluid" th:src="${product != null && product.imageUrl != null} ? ${product.imageUrl} : @{/shop/img/category/s-p1.jpg}"
                 th:alt="${product != null} ? ${product.name} : 'Producto'">
          </div>
          <div class="single-prd-item">
            <img class="img-fluid" th:src="${product != null && product.imageUrl != null} ? ${product.imageUrl} : @{/shop/img/category/s-p1.jpg}"
                 th:alt="${product != null} ? ${product.name} : 'Producto'">
          </div>
        </div>
      </div>
      <div class="col-lg-5 offset-lg-1">
        <div class="s_product_text">
          <h3 th:text="${product != null && product.name != null} ? ${product.name} : 'Zapatillas Zero Nitro Pro'">Zapatillas Zero Nitro Pro</h3>
          <h2 th:text="${product != null && product.price != null} ? ${#numbers.formatCurrency(product.price)} : '$149.99'">$149.99</h2>
          <ul class="list">
            <li><a class="active" href="javascript:void(0);"><span>Categoría</span> : <span th:text="${product != null && product.categoryName != null} ? ${product.categoryName} : 'Calzado Deportivo'">Calzado Deportivo</span></a></li>
            <li>
              <a href="javascript:void(0);"><span>Disponibilidad</span> :
                <span th:if="${product == null || product.stock > 0}" class="text-success font-weight-bold">En Stock</span>
                <span th:if="${product != null && product.stock <= 0}" class="text-danger font-weight-bold">Agotado</span>
              </a>
            </li>
          </ul>
          <p th:text="${product != null && product.description != null} ? ${product.description} : 'Diseñado para brindar el máximo soporte, amortiguación y velocidad en cada entrenamiento. Fabricado con materiales sostenibles de alto impacto.'">
            Diseñado para brindar el máximo soporte, amortiguación y velocidad en cada entrenamiento. Fabricado con materiales sostenibles de alto impacto.
          </p>

          <!-- Formulario Agregar al Carrito -->
          <form th:action="@{/shop/cart/add}" method="POST">
            <input type="hidden" name="productId" th:value="${product != null ? product.id : 1}">

            <div class="product_count d-flex align-items-center mb-4">
              <label for="sst" class="mr-2 mb-0">Cantidad:</label>
              <input type="number" name="quantity" id="sst" min="1" max="50" value="1" title="Cantidad:" class="input-text qty form-control text-center" style="width: 70px;">
            </div>

            <div class="card_area d-flex align-items-center">
              <button type="submit" class="primary-btn border-0" th:disabled="${product != null && product.stock <= 0}">Agregar al Carrito</button>
              <a class="icon_btn" th:href="@{/shop/category}" title="Ver más productos"><i class="lnr lnr-arrow-left"></i></a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
<!--================End Single Product Area =================-->

<!-- Footer Fragment -->
<footer th:replace="~{shop/fragments/footer :: shop-footer}"></footer>

<!-- Scripts Fragment -->
<th:block th:replace="~{shop/fragments/scripts :: shop-scripts}"></th:block>

</body>
</html>
