<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shop/fragments/head :: head}"></head>
<body>

<!-- Header Fragment -->
<header th:replace="~{shop/fragments/header :: header}"></header>

<!-- Banner / Breadcrumb Fragment -->
<section th:replace="~{shop/fragments/banner :: banner}"></section>

<!--================Cart Area =================-->
<section class="cart_area">
  <div class="container">
    <div class="cart_inner">

      <!-- Alertas -->
      <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
        <i class="fa fa-check-circle mr-2"></i><span th:text="${successMessage}">Operación exitosa</span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Cerrar">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <i class="fa fa-exclamation-circle mr-2"></i><span th:text="${errorMessage}">Error</span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Cerrar">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <!-- Estado vacío -->
      <div th:if="${items == null || #lists.isEmpty(items)}" class="text-center py-5">
        <h3 class="mb-3">Tu carrito está vacío</h3>
        <p class="text-muted mb-4">Descubre nuestros productos destacados y renueva tu estilo deportivo.</p>
        <a th:href="@{/shop/category}" class="primary-btn">Explorar Catálogo</a>
      </div>

      <!-- Tabla de Artículos -->
      <div class="table-responsive" th:if="${items != null && !#lists.isEmpty(items)}">
        <table class="table align-middle">
          <thead>
          <tr>
            <th scope="col">Producto</th>
            <th scope="col">Precio</th>
            <th scope="col" style="min-width: 170px;">Cantidad</th>
            <th scope="col">Subtotal</th>
            <th scope="col" class="text-center">Quitar</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="item : ${items}">
            <td>
              <div class="media">
                <div class="d-flex mr-3">
                  <img th:src="@{/shop/img/cart.jpg}"
                       th:alt="${item.producto != null ? item.producto.nombre : 'Producto'}"
                       style="width: 70px; height: 70px; object-fit: cover; border-radius: 8px;">
                </div>
                <div class="media-body">
                  <p class="font-weight-bold mb-0" th:text="${item.producto != null ? item.producto.nombre : 'Producto'}">Nombre de Producto</p>
                  <small class="text-muted" th:if="${item.producto != null && item.producto.talle != null}" th:text="'Talle: ' + ${item.producto.talle}">Talle: M</small>
                </div>
              </div>
            </td>
            <td>
              <h5>$<span th:text="${#numbers.formatDecimal(item.precioUnitario != null ? item.precioUnitario : 0, 1, 'POINT', 2, 'POINT')}">360.00</span></h5>
            </td>
            <td>
              <!-- Formulario de Actualización de Cantidad (100% Server-side sin JavaScript) -->
              <form th:action="@{/shop/cart/update}" method="POST" class="d-inline-flex align-items-center">
                <input type="hidden" name="itemId" th:value="${item.id}">
                <input type="number" name="quantity" min="1" max="99" th:value="${item.cantidad}" class="form-control form-control-sm text-center" style="width: 70px;">
                <button type="submit" class="btn btn-sm btn-outline-dark ml-2" title="Actualizar cantidad">
                  <i class="fa fa-refresh"></i>
                </button>
              </form>
            </td>
            <td>
              <h5>$<span th:text="${#numbers.formatDecimal(item.subtotal != null ? item.subtotal : 0, 1, 'POINT', 2, 'POINT')}">720.00</span></h5>
            </td>
            <td class="text-center">
              <!-- Formulario de Eliminación de Ítem -->
              <form th:action="@{/shop/cart/remove}" method="POST" class="d-inline">
                <input type="hidden" name="itemId" th:value="${item.id}">
                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar ítem">
                  <i class="fa fa-trash"></i>
                </button>
              </form>
            </td>
          </tr>

          <!-- Fila de Acciones Globales (Vaciar Carrito) -->
          <tr>
            <td colspan="3">
              <form th:action="@{/shop/cart/clear}" method="POST" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-secondary">
                  <i class="fa fa-trash-o mr-1"></i> Vaciar Carrito
                </button>
              </form>
            </td>
            <td><h5>Total</h5></td>
            <td><h4 class="text-brand-bold font-weight-bold">$<span th:text="${#numbers.formatDecimal(cart != null && cart.total != null ? cart.total : 0, 1, 'POINT', 2, 'POINT')}">2210.00</span></h4></td>
          </tr>

          <!-- Acciones de Salida -->
          <tr class="out_button_area">
            <td colspan="5">
              <div class="checkout_btn_inner d-flex align-items-center justify-content-end gap-2">
                <a class="gray_btn mr-2" th:href="@{/shop/category}">Continuar Comprando</a>
                <a class="primary-btn" th:href="@{/shop/checkout}">Finalizar Compra</a>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</section>
<!--================End Cart Area =================-->

<!-- Footer Fragment -->
<footer th:replace="~{shop/fragments/footer :: footer}"></footer>

<!-- Scripts Fragment -->
<div th:replace="~{shop/fragments/scripts :: scripts}"></div>

</body>
</html>
