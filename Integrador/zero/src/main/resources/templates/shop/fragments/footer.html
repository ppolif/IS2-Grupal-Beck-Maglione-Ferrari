<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="shop-footer" class="footer-area section_gap">
  <div class="container">
    <div class="row">
      <div class="col-lg-3 col-md-6 col-sm-6">
        <div class="single-footer-widget">
          <h6>Sobre Zero</h6>
          <p>Indumentaria deportiva de alto rendimiento y estilo urbano diseñado para atletas y creadores.</p>
        </div>
      </div>
      <div class="col-lg-4 col-md-6 col-sm-6">
        <div class="single-footer-widget">
          <h6>Newsletter</h6>
          <p>Mantente al día con nuestros últimos lanzamientos y promociones exclusivas.</p>
          <div id="mc_embed_signup">
            <form th:action="@{/shop/newsletter}" method="POST" class="form-inline">
              <div class="d-flex flex-row w-100">
                <input class="form-control" name="email" placeholder="Ingresa tu email" required type="email">
                <button type="submit" class="click-btn btn btn-default"><i class="fa fa-long-arrow-right" aria-hidden="true"></i></button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-6">
        <div class="single-footer-widget mail-chimp">
          <h6 class="mb-20">Instagram Feed</h6>
          <ul class="instafeed d-flex flex-wrap">
            <li><img th:src="@{/shop/img/i1.jpg}" alt=""></li>
            <li><img th:src="@{/shop/img/i2.jpg}" alt=""></li>
            <li><img th:src="@{/shop/img/i3.jpg}" alt=""></li>
            <li><img th:src="@{/shop/img/i4.jpg}" alt=""></li>
            <li><img th:src="@{/shop/img/i5.jpg}" alt=""></li>
            <li><img th:src="@{/shop/img/i6.jpg}" alt=""></li>
          </ul>
        </div>
      </div>
      <div class="col-lg-2 col-md-6 col-sm-6">
        <div class="single-footer-widget">
          <h6>Síguenos</h6>
          <p>Encuéntranos en redes</p>
          <div class="footer-social d-flex align-items-center">
            <a href="#"><i class="fa fa-facebook"></i></a>
            <a href="#"><i class="fa fa-twitter"></i></a>
            <a href="#"><i class="fa fa-instagram"></i></a>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-bottom d-flex justify-content-center align-items-center flex-wrap">
      <p class="footer-text m-0">&copy; <span th:text="${#calendars.year(#calendars.createNow())}">2026</span> Zero Sportswear. Todos los derechos reservados.</p>
    </div>
  </div>
</footer>
</body>
</html>
