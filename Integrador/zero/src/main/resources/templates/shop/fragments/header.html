<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="header_area sticky-header" th:fragment="header">
  <div class="main_menu">
    <nav class="navbar navbar-expand-lg navbar-light main_box">
      <div class="container">
        <!-- Brand Logo ZERO -->
        <a class="navbar-brand logo_h d-inline-flex align-items-center gap-2" th:href="@{/}" href="/">
          <img th:src="@{/admin/assets/images/logo-zero.svg}" src="/admin/assets/images/logo-zero.svg" alt="Zero Logo" style="height: 38px; width: auto;">
          <span style="font-family: 'Poppins', sans-serif; font-size: 1.6rem; font-weight: 800; font-style: italic; color: #141212; letter-spacing: 1.5px; margin-left: 8px;">ZERO</span>
        </a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
                aria-controls="#navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>

        <div class="collapse navbar-collapse offset" id="navbarSupportedContent">
          <ul class="nav navbar-nav menu_nav ml-auto">
            <li class="nav-item active"><a class="nav-link" th:href="@{/}" href="/">Inicio</a></li>
            <li class="nav-item submenu dropdown">
              <a th:href="@{/shop/category}" class="nav-link dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">Tienda</a>
              <ul class="dropdown-menu">
                <li class="nav-item"><a class="nav-link" th:href="@{/shop/category}">Categorías</a></li>
                <li class="nav-item" th:if="${session.usuariosession == null or session.usuariosession.rol.name() == 'CLIENTE'}"><a class="nav-link" th:href="@{/shop/checkout}">Checkout</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/shop/confirmation}">Confirmación</a></li>
              </ul>
            </li>
            <li class="nav-item"><a class="nav-link text-warning font-weight-bold" th:href="@{/offers}"><span class="ti-tag mr-1"></span> Ofertas</a></li>

            <!-- Botón Carrito de Compras (Única aparición en la barra de navegación) -->
            <li class="nav-item" th:if="${session.usuariosession == null or session.usuariosession.rol.name() == 'CLIENTE'}">
              <a class="nav-link font-weight-bold" th:href="@{/shop/cart}" title="Carrito de Compras">
                <span class="ti-bag mr-1"></span> Carrito
              </a>
            </li>

            <!-- Usuario no logueado -->
            <li class="nav-item" th:if="${session.usuariosession == null}">
              <a class="nav-link" th:href="@{/login}">Login</a>
            </li>
            <li class="nav-item" th:if="${session.usuariosession == null}">
              <a class="nav-link font-weight-bold" th:href="@{/register}">Registro</a>
            </li>

            <!-- Usuario logueado -->
            <li class="nav-item submenu dropdown" th:if="${session.usuariosession != null}">
              <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false"
                 style="color: #ffba00; font-weight: 600;">
                <span class="ti-user" style="margin-right: 4px;"></span>
                <span th:text="${session.usuariosession.nombreUsuario}">Usuario</span>
              </a>
              <ul class="dropdown-menu">
                <li class="nav-item">
                  <a class="nav-link font-weight-bold" th:href="@{/profile}"><span class="ti-id-badge mr-1"></span> Mi Perfil</a>
                </li>
                <li class="nav-item" th:if="${session.usuariosession.rol.name() == 'ADMINISTRATIVO' or session.usuariosession.rol.name() == 'JEFE'}">
                  <a class="nav-link text-primary font-weight-bold" th:href="@{/admin}"><span class="ti-layout-grid2 mr-1"></span> Panel Admin</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link text-danger font-weight-bold" th:href="@{/logout}"><span class="ti-power-off mr-1"></span> Cerrar Sesión</a>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contenedor Único Global de Alertas con Auto-Dismiss -->
    <div id="global-alert-container" class="container mt-2" th:if="${successMessage != null or errorMessage != null or infoMessage != null}">
      <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show text-center shadow-sm auto-dismiss-alert" role="alert">
        <i class="fa fa-check-circle mr-2"></i><span th:text="${successMessage}">Operación exitosa</span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div th:if="${errorMessage != null and successMessage == null}" class="alert alert-danger alert-dismissible fade show text-center shadow-sm auto-dismiss-alert" role="alert">
        <i class="fa fa-exclamation-circle mr-2"></i><span th:text="${errorMessage}">Error</span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div th:if="${infoMessage != null and successMessage == null and errorMessage == null}" class="alert alert-info alert-dismissible fade show text-center shadow-sm auto-dismiss-alert" role="alert">
        <i class="fa fa-info-circle mr-2"></i><span th:text="${infoMessage}">Información</span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Script para auto-cerrar la alerta luego de 3.5 segundos -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var alerts = document.querySelectorAll(".auto-dismiss-alert");
      alerts.forEach(function (alertElem) {
        setTimeout(function () {
          alertElem.style.transition = "opacity 0.6s ease";
          alertElem.style.opacity = "0";
          setTimeout(function () {
            if (alertElem.parentNode) {
              alertElem.parentNode.removeChild(alertElem);
            }
          }, 600);
        }, 3500);
      });
    });
  </script>
</header>
</body>
</html>
