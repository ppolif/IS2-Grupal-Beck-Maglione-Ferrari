<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: admin-head(title='Login - Zero Admin')}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Zero Admin</title>
  <link rel="icon" type="image/png" href="../../static/admin/assets/images/favicon.ico" th:href="@{/admin/assets/images/favicon.ico}">

  <!-- Dependencias -->
  <link rel="stylesheet" href="../../static/admin/assets/libs/bootstrap/css/bootstrap.min.css" th:href="@{/admin/assets/libs/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" href="../../static/admin/assets/libs/bootstrap-icons/bootstrap-icons.css" th:href="@{/admin/assets/libs/bootstrap-icons/bootstrap-icons.css}">

  <!-- Única hoja de estilos de paleta -->
  <link rel="stylesheet" href="../../static/admin/assets/css/brand-palette.css" th:href="@{/admin/assets/css/brand-palette.css}">
</head>
<body class="d-flex w-100 align-items-center justify-content-center min-vh-100 p-3">

<div class="card shadow-lg border-brand rounded-4 p-4 p-md-5 w-100 bg-white" style="max-width: 440px;">

  <!-- Logo & Titular -->
  <div class="text-center mb-4">
    <img src="../../static/admin/assets/images/logo-zero.svg" th:src="@{/admin/assets/images/logo-zero.svg}" alt="Zero Logo" class="img-fluid mb-2" style="height: 52px;">
    <h1 class="h3 fw-bold mb-1 text-brand-dark">Bienvenido a Zero</h1>
    <p class="text-muted small mb-0">Ingresa a tu cuenta de administración para continuar</p>
  </div>

  <!-- Alertas de Sesión / Error -->
  <div th:if="${param.error}" th:class="'alert alert-danger py-2 small rounded-3'" class="alert alert-danger py-2 small rounded-3 d-none" role="alert">
    Credenciales incorrectas. Verifique correo y contraseña.
  </div>
  <div th:if="${param.logout}" th:class="'alert alert-success py-2 small rounded-3'" class="alert alert-success py-2 small rounded-3 d-none" role="alert">
    Has cerrado sesión con éxito.
  </div>
  <div th:if="${errorMessage}" th:class="'alert alert-danger py-2 small rounded-3'" class="alert alert-danger py-2 small rounded-3 d-none" role="alert" th:text="${errorMessage}"></div>

  <!-- Formulario con utilidades Bootstrap -->
  <form action="index.html" th:action="@{/admin/login}" method="POST" id="loginForm">

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label small fw-bold text-brand-dark">Correo Electrónico</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-brand text-muted"><i class="bi bi-envelope"></i></span>
        <input type="email" id="email" name="username" class="form-control border-brand bg-light" placeholder="nombre@empresa.com" required>
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label for="password" class="form-label small fw-bold text-brand-dark">Contraseña</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-brand text-muted"><i class="bi bi-shield-lock"></i></span>
        <input type="password" id="password" name="password" class="form-control border-brand bg-light" placeholder="••••••••" required>
        <button class="btn btn-outline-secondary border-brand bg-light" type="button" id="toggle-password">
          <i class="bi bi-eye"></i>
        </button>
      </div>
    </div>

    <!-- Opciones -->
    <div class="d-flex justify-content-between align-items-center mb-4 small">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
        <label class="form-check-label text-muted" for="rememberMe">Recordarme</label>
      </div>
      <a href="#" class="text-brand-soft fw-semibold text-decoration-none">¿Olvidaste tu contraseña?</a>
    </div>

    <!-- Botón Ingresar -->
    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold d-flex align-items-center justify-content-center gap-2 rounded-3">
      <span>Ingresar al Panel</span>
      <i class="bi bi-arrow-right"></i>
    </button>
  </form>

  <div class="text-center mt-4 pt-3 border-top border-brand">
    <a href="../shop/index.html" th:href="@{/shop}" class="small text-brand-soft text-decoration-none fw-bold">
      <i class="bi bi-arrow-left"></i> Volver a la Tienda
    </a>
  </div>

</div>

<script src="../../static/admin/assets/libs/bootstrap/js/bootstrap.bundle.min.js" th:src="@{/admin/assets/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script src="../../static/admin/assets/js/auth.js" th:src="@{/admin/assets/js/auth.js}"></script>
</body>
</html>
