<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zero Admin</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.ico">

    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="assets/libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/libs/bootstrap-icons/bootstrap-icons.css">

    <!-- Paleta centralizada -->
    <link rel="stylesheet" href="assets/css/brand-palette.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="card shadow-lg border-brand rounded-4 p-4 p-md-5 w-100 bg-white" style="max-width: 440px;">

    <!-- Logo & Titular -->
    <div class="text-center mb-4">
        <img src="assets/images/logo-zero.svg" alt="Zero Logo" class="img-fluid mb-2" style="height: 52px;">
        <h1 class="h3 fw-bold mb-1 text-brand-dark">Bienvenido a Zero</h1>
        <p class="text-muted small mb-0">Ingresa a tu cuenta de administración para continuar</p>
    </div>

    <!-- Formulario con utilidades Bootstrap -->
    <form action="index.html" method="GET" id="loginForm">

        <!-- Email -->
        <div class="mb-3">
            <label for="email" class="form-label small fw-bold text-brand-dark">Correo Electrónico</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-brand text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control border-brand bg-light" placeholder="nombre@empresa.com" required>
            </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label for="password" class="form-label small fw-bold text-brand-dark">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-brand text-muted"><i class="bi bi-shield-lock"></i></span>
                <input type="password" id="password" class="form-control border-brand bg-light" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary border-brand bg-light" type="button" id="toggle-password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <!-- Opciones -->
        <div class="d-flex justify-content-between align-items-center mb-4 small">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted" for="rememberMe">Recordarme</label>
            </div>
            <a href="#" class="text-brand-soft fw-semibold text-decoration-none">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón Ingresar -->
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold d-flex align-items-center justify-content-center gap-2 rounded-3">
            <span>Ingresar al Panel</span>
            <i class="bi bi-arrow-right"></i>
        </button>
    </form>

    <div class="position-relative text-center my-4">
        <hr class="border-brand">
        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted text-uppercase fw-bold">O continúa con</span>
    </div>

    <!-- Botones sociales -->
    <div class="row g-2 mb-4">
        <div class="col-6">
            <button class="btn btn-outline-dark w-100 btn-sm py-2 d-flex align-items-center justify-content-center gap-2 border-brand" type="button">
                <i class="bi bi-google text-danger"></i> Google
            </button>
        </div>
        <div class="col-6">
            <button class="btn btn-outline-dark w-100 btn-sm py-2 d-flex align-items-center justify-content-center gap-2 border-brand" type="button">
                <i class="bi bi-github"></i> GitHub
            </button>
        </div>
    </div>

    <p class="text-center text-muted small mb-0">
        ¿No tienes cuenta? <a href="#" class="text-brand-bold fw-bold text-decoration-none">Regístrate</a>
    </p>

</div>

<script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
