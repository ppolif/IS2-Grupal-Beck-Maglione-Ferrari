<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: admin-head(title='404 No Encontrado - Zero Admin')}">
  <meta charset="UTF-8">
  <title>404 - Zero Admin</title>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="card shadow-lg border-brand rounded-4 p-5 text-center bg-white" style="max-width: 520px;">

  <!-- Logo -->
  <a th:href="@{/admin}" class="d-inline-flex align-items-center justify-content-center text-decoration-none gap-2 mb-4">
    <img th:src="@{/admin/assets/images/logo-zero.svg}" alt="Zero Logo" style="height: 38px;">
    <span class="h4 fw-bold mb-0 text-brand-dark">ZERO ADMIN</span>
  </a>

  <!-- Número 404 grande con utilidades de Bootstrap -->
  <div class="display-1 fw-bold text-brand-dark d-flex align-items-center justify-content-center gap-2 mb-3">
    <span>4<img th:src="@{/admin/assets/images/logo-zero.svg}" alt="0" style="height: 75px; margin-left: 12px; margin-bottom: 12px;">4</span>

  <h2 class="h4 fw-bold text-brand-dark mb-2">Página No Encontrada</h2>
  <p class="text-muted mb-4 small">
    La página que buscas no existe o ha sido movida temporalmente.
  </p>

  <div class="d-flex justify-content-center gap-2">
    <a th:href="@{/admin}" class="btn btn-primary px-4 py-2 rounded-3 fw-bold d-inline-flex align-items-center gap-2">
      <i class="bi bi-house"></i> Panel Admin
    </a>
    <a th:href="@{/shop}" class="btn btn-outline-dark px-4 py-2 rounded-3 fw-bold d-inline-flex align-items-center gap-2">
      <i class="bi bi-shop"></i> Ir a Tienda
    </a>

</div>

<script th:src="@{/admin/assets/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
