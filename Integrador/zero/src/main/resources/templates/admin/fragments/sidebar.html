<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="sidebar-wrapper" id="sidebar" th:fragment="sidebar">
  <!-- Brand Logo -->
  <a class="sidebar-brand sidebar-brand-zero d-flex align-items-center gap-2 mb-4 text-decoration-none" th:href="@{/admin}">
    <img th:src="@{/admin/assets/images/logo-zero.svg}" alt="Zero Admin" style="height: 36px;">
    <span class="h5 fw-bold mb-0 text-brand-dark">ZERO ADMIN</span>
  </a>

  <!-- Menu Links -->
  <div class="flex-grow-1 overflow-y-auto">
    <div class="small fw-bold text-uppercase text-muted px-2 mb-2">Menú</div>
    <ul class="nav nav-pills flex-column gap-1 mb-4">
      <li class="nav-item">
        <a th:href="@{/admin}" class="nav-link d-flex align-items-center gap-2"
           th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/admin'} ? ' active' : ''">
          <i class="bi bi-grid-fill"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a th:href="@{/admin/orders}" class="nav-link d-flex align-items-center gap-2"
           th:classappend="${#httpServletRequest != null && #httpServletRequest.requestURI == '/admin/orders'} ? ' active' : ''">
          <i class="bi bi-table"></i>
          <span>Tablas de Órdenes</span>
        </a>
      </li>
    </ul>


  <!-- Perfil Card Footer -->
  <div class="sidebar-profile d-flex align-items-center gap-2 p-2 bg-white rounded-3 border mt-auto">
    <img th:src="@{/admin/assets/images/avatar.png}" alt="Avatar" class="rounded-circle" width="38" height="38">
    <div class="overflow-hidden">
      <div class="small fw-bold text-truncate text-brand-dark">Administrador</div>
      <div class="text-muted text-truncate" style="font-size: 0.75rem;">admin@zero.com</div>
    </div>
  </div>
</aside>

</body>
</html>
