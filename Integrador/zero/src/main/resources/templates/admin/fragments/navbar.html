<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<nav class="navbar navbar-expand bg-white rounded-4 border border-brand px-3 py-2 mb-4 d-flex justify-content-between align-items-center shadow-sm"
     th:fragment="navbar">

  <div class="d-flex align-items-center gap-2">
    <!-- Botón Toggle con la clase requerida por dashboard.js -->
    <button class="btn btn-sm btn-outline-dark d-xl-none sidebar-toggle-btn" id="sidebar-toggle" type="button" aria-label="Toggle Menu">
      <i class="bi bi-list"></i>
    </button>
    <form th:action="@{/admin/orders}" method="GET" class="input-group input-group-sm" style="max-width: 300px;">
      <input type="text" name="keyword" class="form-control border-brand" placeholder="Buscar en Zero Admin...">
      <button class="btn btn-outline-dark border-brand" type="submit"><i class="bi bi-search"></i></button>
    </form>
  </div>

  <div class="d-flex align-items-center gap-2">
    <a th:href="@{/shop}" target="_blank" class="btn btn-sm btn-outline-dark d-flex align-items-center gap-1">
      <i class="bi bi-shop"></i> Tienda
    </a>
    <a th:href="@{/admin/login}" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1">
      <i class="bi bi-box-arrow-right"></i> Salir
    </a>
  </div>

</nav>

</body>
</html>
