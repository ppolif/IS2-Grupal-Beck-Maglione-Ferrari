<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Fragmento Head -->
<head th:replace="~{admin/fragments/head :: head}"></head>

<body class="d-flex">

<!-- Fragmento Sidebar -->
<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

<!-- Contenido Principal -->
<main class="main-content-offset p-4 p-md-5 min-vh-100 d-flex flex-column flex-grow-1">

  <!-- Top Navbar Fragment -->
  <nav th:replace="~{admin/fragments/navbar :: navbar}"></nav>

  <!-- Header de sección -->
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h1 class="h3 fw-bold text-brand-dark mb-1" th:text="${isEdit ? 'Modificar Producto' : 'Alta de Nuevo Producto'}">Alta de Producto</h1>
      <p class="text-muted small mb-0" th:text="${isEdit ? 'Actualice la información y el precio del producto existente.' : 'Complete el formulario para registrar un nuevo producto en el catálogo.'}">Información de catálogo.</p>
    </div>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0 small">
        <li class="breadcrumb-item"><a th:href="@{/admin}" class="text-decoration-none text-muted">Inicio</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/products}" class="text-decoration-none text-muted">Productos</a></li>
        <li class="breadcrumb-item active text-brand-dark" aria-current="page" th:text="${isEdit ? 'Modificar' : 'Nuevo'}">Nuevo</li>
      </ol>
    </nav>
  </div>

  <!-- Alerta de Error -->
  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 py-2 small" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-1"></i>
    <span th:text="${errorMessage}">Error al procesar el producto</span>
    <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <!-- Card Formulario -->
  <div class="card bg-white border-brand rounded-4 shadow-sm overflow-hidden mb-4" style="max-width: 800px;">
    <div class="card-header bg-white border-bottom border-brand p-3">
      <h5 class="fw-bold mb-0 text-brand-dark" th:text="${isEdit ? 'Datos del Producto #' + producto.codigo : 'Datos del Nuevo Producto'}">Datos del Producto</h5>
    </div>

    <div class="card-body p-4">
      <form th:action="${isEdit} ? @{/admin/products/editar/{id}(id=${producto.id})} : @{/admin/products/guardar}" method="POST">

        <div class="row g-3">

          <!-- Código del Producto -->
          <div class="col-md-6">
            <label for="codigo" class="form-label small fw-bold text-brand-dark">Código de Producto <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="codigo" name="codigo"
                   th:value="${isEdit ? producto.codigo : (codigo != null ? codigo : '')}"
                   th:readonly="${isEdit}"
                   placeholder="Ej: PROD-101" required>
            <div class="form-text" th:if="${isEdit}">El código es un identificador único y no puede modificarse.</div>
          </div>

          <!-- Nombre -->
          <div class="col-md-6">
            <label for="nombre" class="form-label small fw-bold text-brand-dark">Nombre del Producto <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="nombre" name="nombre"
                   th:value="${producto != null && producto.nombre != null ? producto.nombre : (nombre != null ? nombre : '')}"
                   placeholder="Ej: Zero Runner Nitro" required>
          </div>

          <!-- Subcategoría -->
          <div class="col-md-6">
            <label for="subCategoriaId" class="form-label small fw-bold text-brand-dark">Subcategoría <span class="text-danger">*</span></label>
            <select class="form-select" id="subCategoriaId" name="subCategoriaId" required>
              <option value="" disabled th:selected="${(producto == null || producto.subCategoria == null) && selectedSubcategoriaId == null}">-- Seleccione una subcategoría --</option>
              <option th:each="sub : ${subcategorias}"
                      th:value="${sub.id}"
                      th:text="${sub.categoria != null ? sub.categoria.nombre + ' &gt; ' + sub.nombre : sub.nombre}"
                      th:selected="${(producto != null && producto.subCategoria != null && producto.subCategoria.id == sub.id) || selectedSubcategoriaId == sub.id}">
                Zapatillas Running
              </option>
            </select>
          </div>

          <!-- Talle -->
          <div class="col-md-6">
            <label for="talle" class="form-label small fw-bold text-brand-dark">Talle / Medida</label>
            <input type="text" class="form-control" id="talle" name="talle"
                   th:value="${producto != null && producto.talle != null ? producto.talle : (talle != null ? talle : '')}"
                   placeholder="Ej: S, M, L, XL, 42">
          </div>

          <!-- Precio -->
          <div class="col-md-6">
            <label for="precio" class="form-label small fw-bold text-brand-dark">
              <span th:text="${isEdit ? 'Precio Actual / Nuevo Precio ($)' : 'Precio Inicial ($)'}">Precio Inicial ($)</span>
              <span class="text-danger">*</span>
            </label>
            <div class="input-group">
              <span class="input-group-text bg-light">$</span>
              <input type="number" step="0.01" min="0.01" class="form-control" id="precio" name="precio"
                     th:value="${precioActual != null && precioActual > 0 ? precioActual : (precio != null ? precio : '')}"
                     placeholder="0.00" required>
            </div>
            <div class="form-text" th:if="${isEdit}">Si ingresa un valor distinto, se generará una nueva vigencia de precio automáticamente.</div>
          </div>

          <!-- En Oferta -->
          <div class="col-md-6 d-flex align-items-center">
            <div class="form-check mt-3">
              <input class="form-check-input" type="checkbox" id="enOferta" name="enOferta" value="true"
                     th:checked="${(producto != null && producto.enOferta) || (enOferta != null && enOferta)}">
              <label class="form-check-label small fw-bold text-brand-dark" for="enOferta">
                Destacar en Oferta en la Tienda
              </label>
            </div>
          </div>

          <!-- Descripción -->
          <div class="col-12">
            <label for="descripcion" class="form-label small fw-bold text-brand-dark">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                      placeholder="Características, tecnología y detalles del producto..."
                      th:text="${producto != null && producto.descripcion != null ? producto.descripcion : (descripcion != null ? descripcion : '')}"></textarea>
          </div>

        </div>

        <hr class="my-4">

        <!-- Botones de Acción -->
        <div class="d-flex justify-content-end gap-2">
          <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-dark d-flex align-items-center gap-1">
            <i class="bi bi-check2-circle"></i>
            <span th:text="${isEdit ? 'Actualizar Producto' : 'Guardar Producto'}">Guardar Producto</span>
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- Footer Fragment -->
  <footer th:replace="~{admin/fragments/footer :: footer}"></footer>

</main>

<!-- Scripts Fragment -->
<div th:replace="~{admin/fragments/scripts :: scripts}"></div>

</body>
</html>
