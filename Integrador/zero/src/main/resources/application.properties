spring.application.name=zero

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/zero?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Para ver cambios en html sin reiniciar el servidor
spring.thymeleaf.cache=false
