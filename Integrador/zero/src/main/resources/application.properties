spring.application.name=${SPRING_APPLICATION_NAME:zero}

server.port=${PORT:${SERVER_PORT:8080}}

# ===================================================================
# Configuración de Base de Datos (MySQL)
# Soporta DB_URL directa o variables individuales DB_HOST, DB_PORT, DB_NAME
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Caché de Thymeleaf (en producción se recomienda true)
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ===================================================================
# Configuración de Java Mail Sender (Gmail)
# ===================================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Soporte de proxies / túneles (ngrok, cloudflared, localtunnel)
server.forward-headers-strategy=framework

# ===================================================================
# Configuración de Pasarela Mercado Pago
# ===================================================================
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
# URL pública opcional para tunneling o dominio de producción:
mercadopago.base-url=${MERCADOPAGO_BASE_URL}

# ===================================================================
# Configuración de Newsletter de Ofertas
# ===================================================================
newsletter.cron=${NEWSLETTER_CRON:0 0 9 */10 * *}

# ===================================================================
# Configuración de subida de archivos y fotos de perfil
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB

# ===================================================================
# Configuración de Actualización de Precios por Inflación (Argentina)
# ===================================================================
# Cron bimestral: A las 02:00 AM el día 1 de cada 2 meses (Enero, Marzo, Mayo, Julio, Septiembre, Noviembre)
inflacion.cron=${INFLACION_CRON:0 0 2 1 */2 ?}
# Porcentaje de inflación bimestral estimado por defecto
inflacion.porcentaje-bimestral=${INFLACION_PORCENTAJE_BIMESTRAL:8.0}
# Tamaño de página para la query paginada (optimización de memoria)
inflacion.batch-size=${INFLACION_BATCH_SIZE:100}
