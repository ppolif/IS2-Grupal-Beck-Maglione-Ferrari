# Base de datos H2 en memoria con compatibilidad MySQL para tests
spring.datasource.url=jdbc:h2:mem:zerodb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Desactivar mail real durante tests
spring.mail.host=localhost
spring.mail.port=2525

# Crons silenciados en tests
newsletter.cron=0 0 0 1 1 ?
inflacion.cron=0 0 0 1 1 ?

selenium.headless=false

