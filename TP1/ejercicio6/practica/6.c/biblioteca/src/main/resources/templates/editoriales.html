<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca | Editoriales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light pb-5">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/inicio}">Mi Biblioteca</a>
        <div class="d-flex align-items-center">
            <a th:href="@{/gestion}" class="btn btn-outline-light btn-sm me-3">Volver a Gestión</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-light">Listado de Editoriales</h2>
        <a th:href="@{/editoriales/nuevo}" class="btn btn-dark">+ Nueva Editorial</a>
    </div>

    <div th:if="${param.exito}" class="alert alert-success mt-2 mb-4" role="alert" th:text="${param.exito}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="editorial : ${editoriales}">
                    <td th:text="${editorial.nombre}" class="fw-bold align-middle"></td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center gap-1">
                            <a th:href="@{/editoriales/editar/{id}(id=${editorial.id})}" class="btn btn-sm btn-outline-primary">Editar</a>

                            <form th:action="@{/editoriales/eliminar/{id}(id=${editorial.id})}" method="POST" class="m-0" onsubmit="return confirm('¿Seguro que deseas eliminar esta editorial?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
