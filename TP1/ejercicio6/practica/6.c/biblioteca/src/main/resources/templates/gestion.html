<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca | Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light pb-5">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/inicio}">Mi Biblioteca</a>
        <div class="d-flex align-items-center">
            <a th:href="@{/inicio}" class="btn btn-outline-light btn-sm me-3">Volver al Panel</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="fw-light mb-4">Gestión Interna</h2>

    <div class="row g-4">
        <!-- Autores -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body text-center p-4">
                    <h5 class="card-title fw-bold">Autores</h5>
                    <p class="card-text text-muted small">Alta, baja y modificación de autores.</p>
                    <a th:href="@{/autores}" class="btn btn-dark w-100 mt-2">Gestionar Autores</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body text-center p-4">
                    <h5 class="card-title fw-bold">Editoriales</h5>
                    <p class="card-text text-muted small">Alta, baja y modificación de editoriales.</p>
                    <a th:href="@{/editoriales}" class="btn btn-dark w-100 mt-2">Gestionar Editoriales</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body text-center p-4">
                    <h5 class="card-title fw-bold">Usuarios</h5>
                    <p class="card-text text-muted small">Ver listado de usuarios</p>
                    <a th:href="@{/usuarios}" class="btn btn-dark w-100 mt-2">Gestionar Usuarios</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
