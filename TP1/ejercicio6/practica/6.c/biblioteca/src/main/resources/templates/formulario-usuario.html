<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca | Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light pb-5">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/inicio}">Mi Biblioteca</a>
        <div class="d-flex align-items-center">
            <a th:href="@{/usuarios}" class="btn btn-outline-light btn-sm me-3">Volver a Usuarios</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h4 class="mb-4 fw-light" th:text="${modoEdicion != null} ? 'Editar Usuario' : 'Nuevo Usuario'"></h4>

                    <!-- Alerta para errores de negocio (ej. mail o DNI duplicados) -->
                    <div th:if="${errorNegocio}" class="alert alert-danger" role="alert" th:text="${errorNegocio}"></div>

                    <form th:action="${modoEdicion != null} ? @{/usuarios/editar/{id}(id=${idUsuario})} : @{/usuarios/nuevo}"
                          method="POST" th:object="${usuarioDTO}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small">DNI</label>
                                <input type="number" class="form-control" th:field="*{dni}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small">Nombre Completo</label>
                            <input type="text" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small">Correo Electrónico</label>
                            <input type="email" class="form-control" th:field="*{mail}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted small" th:text="${modoEdicion != null} ? 'Nueva Contraseña (o repita la actual)' : 'Contraseña'"></label>
                            <input type="password" class="form-control" th:field="*{clave}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-dark" th:text="${modoEdicion != null} ? 'Guardar Cambios' : 'Registrar Usuario'"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
