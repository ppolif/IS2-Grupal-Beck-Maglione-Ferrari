<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error Interno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container text-center">
    <h1 class="display-1 text-secondary fw-bold">404</h1>
    <h2 class="fw-light">Ups, algo salió mal.</h2>
    <p class="lead text-muted">El recurso solicitado no existe</p>
    <p class="small text-muted" th:if="${traceId}">Código de referencia: <span th:text="${traceId}" class="fw-bold"></span></p>
    <a th:href="@{/inicio}" class="btn btn-dark mt-3">Volver al Inicio</a>
</div>
</body>
</html>
