<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca | Formulario Autor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light pb-5">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/inicio}">Mi Biblioteca</a>
        <div class="d-flex align-items-center">
            <a th:href="@{/autores}" class="btn btn-outline-light btn-sm me-3">Volver a Autores</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h4 class="mb-4 fw-light" th:text="${modoEdicion != null} ? 'Editar Autor' : 'Nuevo Autor'"></h4>

                    <form th:action="${modoEdicion != null} ? @{/autores/editar/{id}(id=${idAutor})} : @{/autores/nuevo}"
                          method="POST" th:object="${autorDTO}">

                        <div class="mb-4">
                            <label class="form-label text-muted small">Nombre Completo del Autor</label>
                            <input type="text" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/autores}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-dark" th:text="${modoEdicion != null} ? 'Guardar Cambios' : 'Registrar Autor'"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
