# ==========================================
# CONEXION A LA BASE DE DATOS MYSQL
# ==========================================

# useSSL=false y allowPublicKeyRetrieval=true son para desarrollo local
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Mendoza
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

# ddl-auto controla que hace Hibernate con las tablas al arrancar:
#   create      -> borra y crea las tablas de cero cada vez que arranca (perdes los datos)
#   create-drop -> igual que create, pero ademas las borra al apagar la app
#   update      -> crea lo que falta y agrega columnas nuevas, SIN borrar datos existentes
#   validate    -> no toca la BD, solo valida que las entidades coincidan con las tablas
#   none        -> Hibernate no hace nada con el esquema

spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que genera Hibernate (util para debuggear)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Evita un warning comun de Hibernate al abrir la conexion
spring.jpa.open-in-view=false

# ==========================================
# SERVIDOR
# ==========================================

server.port=8080
