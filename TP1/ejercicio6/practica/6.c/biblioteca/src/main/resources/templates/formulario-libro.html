<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca | Formulario Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light pb-5">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/inicio}">Mi Biblioteca</a>
        <div class="d-flex align-items-center">
            <a th:href="@{/libros}" class="btn btn-outline-light btn-sm me-3">Volver al Catálogo</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h4 class="mb-4 fw-light" th:text="${modoEdicion != null} ? 'Editar Libro' : 'Nuevo Libro'"></h4>

                    <div th:if="${errorNegocio}" class="alert alert-danger" role="alert" th:text="${errorNegocio}"></div>

                    <!-- AGREGADO enctype PARA PERMITIR SUBIDA DE ARCHIVOS -->
                    <form th:action="${modoEdicion != null} ? @{/libros/editar/{id}(id=${libroDTO.isbn})} : @{/libros/nuevo}"
                          method="POST" th:object="${libroDTO}" enctype="multipart/form-data">

                        <!-- Campo oculto para no perder la imagen si estamos editando -->
                        <input type="hidden" th:field="*{idImagen}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small">ISBN</label>
                                <input type="number" class="form-control" th:field="*{isbn}" th:errorclass="is-invalid" th:readonly="${modoEdicion != null}">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small">Año de Publicación</label>
                                <input type="number" class="form-control" th:field="*{anio}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('anio')}" th:errors="*{anio}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small">Título</label>
                            <input type="text" class="form-control" th:field="*{titulo}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small">Cantidad de Ejemplares Totales</label>
                            <input type="number" class="form-control" th:field="*{ejemplares}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('ejemplares')}" th:errors="*{ejemplares}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label text-muted small">Editorial</label>
                                <select class="form-select" th:field="*{idEditorial}" th:errorclass="is-invalid">
                                    <option value="">Seleccione una editorial</option>
                                    <option th:each="edi : ${editoriales}" th:value="${edi.id}" th:text="${edi.nombre}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('idEditorial')}" th:errors="*{idEditorial}"></div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label text-muted small">Autor/es (Mantener Ctrl para seleccionar varios)</label>
                                <select class="form-select" th:field="*{idAutores}" multiple="multiple" style="height: 100px;" th:errorclass="is-invalid">
                                    <option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nombre}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('idAutores')}" th:errors="*{idAutores}"></div>
                            </div>
                        </div>

                        <!-- NUEVO INPUT PARA LA IMAGEN -->
                        <div class="mb-4 p-3 border rounded bg-light">
                            <label class="form-label text-muted small fw-bold">Portada del Libro</label>
                            <input type="file" class="form-control" name="archivo" accept="image/png, image/jpeg, image/jpg">
                            <small class="text-muted d-block mt-1" th:if="${modoEdicion != null}">Sube un archivo solo si deseas cambiar la portada actual.</small>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/libros}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-dark" th:text="${modoEdicion != null} ? 'Guardar Cambios' : 'Crear Libro'"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
