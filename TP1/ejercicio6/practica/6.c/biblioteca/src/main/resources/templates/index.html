<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Biblioteca Nacional</a>
        <div class="d-flex">
            <a th:href="@{/login}" class="btn btn-outline-light me-2">Iniciar Sesión</a>
            <a th:href="@{/registro}" class="btn btn-light">Registrarse</a>
        </div>
    </div>
</nav>

<div class="container mt-5 pt-5 text-center">
    <h1 class="display-4 fw-bold text-dark mb-3">Descubre tu próximo libro favorito</h1>
    <p class="lead text-muted mb-5">El catálogo más completo al alcance de tu mano. Regístrate para comenzar a solicitar préstamos.</p>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <img th:src="@{/img/portada-biblioteca.jpg}" alt="Biblioteca" class="img-fluid rounded shadow" style="max-height: 400px; object-fit: cover; width: 100%;"
                 onerror="this.src='https://images.unsplash.com/photo-1507842217343-583bb7270b66?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80'">
        </div>
    </div>
</div>

</body>
</html>
