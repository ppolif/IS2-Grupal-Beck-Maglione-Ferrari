<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    <h4 class="text-center mb-4 fw-light">Crear Cuenta</h4>

                    <!-- Error de lógica de negocio (Ej: DNI o Mail duplicado) -->
                    <div th:if="${errorNegocio}" class="alert alert-danger" role="alert" th:text="${errorNegocio}"></div>

                    <!-- Formulario Thymeleaf puro -->
                    <form th:action="@{/registro}" method="POST" th:object="${usuarioDTO}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small">DNI</label>
                                <input type="number" class="form-control" th:field="*{dni}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small">Nombre Completo</label>
                            <input type="text" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Correo Electrónico</label>
                            <input type="email" class="form-control" th:field="*{mail}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small">Contraseña</label>
                            <input type="password" class="form-control" th:field="*{clave}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}"></div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark btn-lg">Registrarse</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <p class="text-muted small">¿Ya tienes cuenta? <a th:href="@{/login}" class="text-dark fw-bold text-decoration-none">Inicia sesión</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
