<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinder de Mascota - Registro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand navbar-dark custom-navbar py-2 px-3">
    <div class="container-fluid px-md-5">
        <a class="navbar-brand text-uppercase" href="/">Tinder de Mascota</a>
        <div class="navbar-nav ms-auto gap-3">
            <a class="nav-link text-uppercase active" href="/registro">Registro</a>
            <a class="nav-link text-uppercase" href="/login">Log In</a>
        </div>
    </div>
</nav>

<main>
    <!-- Presentación / Hero Section -->
    <section class="hero-section text-center">
        <div class="container position-relative" style="z-index: 2;">
            <h1 class="hero-title">Tinder de Mascota</h1>
            <p class="hero-subtitle">Encontrale pareja a tu choco.</p>
            <a href="/registro" class="btn-pill-pink text-uppercase">¡Registrate!</a>
        </div>
    </section>

    <!-- Sección del Formulario de Registro -->
    <section class="container py-5">
        <div class="row align-items-center justify-content-between">

            <!-- Columna Izquierda: Formulario -->
            <div class="col-lg-5 col-md-6 pe-md-4">
                <h2 class="view-heading">Registrate</h2>

                <form class="custom-form" action="/registrar" method="POST" enctype="multipart/form-data">
                    <p th:if="${error != null}" th:text="${error}" style="color: red"></p>

                    <div>
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required th:value="${nombre}">
                    </div>

                    <div>
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellido" name="apellido" required th:value="${apellido}">
                    </div>

                    <div>
                        <label for="email" class="form-label">E-Mail</label>
                        <input type="email" class="form-control" id="email" name="email" required th:value="${email}">
                    </div>

                    <div>
                        <label>Foto</label>
                        <input type="file" class="form-control" name="archivo" />
                    </div>

                    <div>
                        <label>Zona</label>
                        <select class="form-control" name="idZona">
                            <option th:each="zona : ${zonas}" th:value="${zona.id}" th:text="${zona.nombre}"></option>
                        </select>
                    </div>

                    <div>
                        <label for="clave" class="form-label">Clave</label>
                        <input type="password" class="form-control" id="clave" name="clave" required th:value="${clave}">
                    </div>

                    <div>
                        <label for="repetirClave" class="form-label">Repetir Clave</label>
                        <input type="password" class="form-control" id="repetirClave" name="repetirClave" required th:value="${repetirClave}">
                    </div>

                    <button type="submit" class="btn-submit-pink mt-2">Registrarme</button>
                </form>
            </div>

            <!-- Columna Derecha: Imagen Ovalada -->
            <div class="col-lg-6 col-md-6 text-center mt-5 mt-md-0">
                <div class="img-oval-mask">
                    <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=800" alt="Perro con pelota verde">
                </div>
            </div>

        </div>
    </section>
</main>

<!-- Footer -->
<footer class="custom-footer text-center">
    <div class="container">
        Copyright &copy; Your Website 2019
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
