<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinder de Mascota - Ingresá a Tinder</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand navbar-dark custom-navbar py-2 px-3">
    <div class="container-fluid px-md-5">
        <a class="navbar-brand text-uppercase" href="index.html">Tinder de Mascota</a>
        <div class="navbar-nav ms-auto gap-3">
            <a class="nav-link text-uppercase" href="registro.html">Registro</a>
            <a class="nav-link text-uppercase active" href="login.html">Log In</a>
        </div>
    </div>
</nav>

<main>
    <!-- Presentación / Hero Section -->
    <section class="hero-section text-center">
        <div class="container position-relative" style="z-index: 2;">
            <h1 class="hero-title">Tinder de Mascota</h1>
            <p class="hero-subtitle">Encontrale pareja a tu choco.</p>
            <a href="registro.html" class="btn-pill-pink text-uppercase">¡Registrate!</a>
        </div>
    </section>

    <!-- Sección del Formulario de Login -->
    <section class="container py-5">
        <div class="row align-items-center justify-content-between">

            <!-- Columna Izquierda: Formulario -->
            <div class="col-lg-5 col-md-6 pe-md-4">
                <h2 class="view-heading">Ingresá a Tinder</h2>

                <form class="custom-form" th:action="@{/logincheck}" method="POST">
                    <div>
                        <label for="email" class="form-label">E-Mail</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div>
                        <label for="clave" class="form-label">Clave</label>
                        <input type="password" class="form-control" id="clave" name="clave" required>
                    </div>

                    <button type="submit" class="btn-submit-pink mt-2">Ingresar</button>
                </form>
            </div>

            <!-- Columna Derecha: Imagen Ovalada -->
            <div class="col-lg-6 col-md-6 text-center mt-5 mt-md-0">
                <div class="img-oval-mask">
                    <img src="https://images.unsplash.com/photo-1548767797-d8c844163c4c?q=80&w=800" alt="Gatitos y perrito en canasta">
                </div>
            </div>

        </div>
    </section>
</main>

<!-- Footer -->
<footer class="custom-footer text-center">
    <div class="container">
        Copyright &copy; Your Website 2019
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
