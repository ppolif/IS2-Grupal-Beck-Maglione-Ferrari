<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStore - Tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar Comercial -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/inicio}"><i class="bi bi-controller me-2"></i>GameStore</a>
        <div class="d-flex gap-2">
            <form class="d-flex" th:action="@{/busqueda}" method="get">
                <input class="form-control form-control-sm me-2" type="search" name="query" placeholder="Buscar juego..." aria-label="Search">
                <button class="btn btn-outline-light btn-sm" type="submit"><i class="bi bi-search"></i></button>
            </form>
            <a class="btn btn-primary btn-sm" th:href="@{/crud}">Panel Admin</a>
        </div>
    </div>
</nav>

<!-- Header Banner -->
<header class="bg-dark text-white py-4 mb-4 border-bottom border-secondary">
    <div class="container text-center">
        <h1 class="display-6 fw-bold">Catálogo de Videojuegos</h1>
        <p class="lead mb-0 text-secondary">Encuentra tus títulos favoritos al mejor precio</p>
    </div>
</header>

<!-- Grilla de Productos (Cards) -->
<main class="container mb-5">
    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col" th:each="juego : ${videojuegos}">
            <div class="card h-100 shadow-sm">
                <img th:src="${juego.imagen != null and !juego.imagen.isEmpty()} ? @{'/imagenes/' + ${juego.imagen}} : 'https://dummyimage.com/450x300/dee2e6/6c757d.jpg'"
                     class="card-img-top" style="height: 180px; object-fit: cover;" th:alt="${juego.titulo}">

                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="badge bg-secondary" th:text="${juego.categoria.nombre}">Categoría</span>
                        <span class="badge bg-info text-dark" th:text="${juego.estudio.nombre}">Estudio</span>
                    </div>
                    <h5 class="card-title text-truncate" th:text="${juego.titulo}">Título</h5>
                    <p class="card-text text-muted small flex-grow-1" th:text="${juego.descripcion}">Descripción</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fs-5 fw-bold text-primary" th:text="'$' + ${#numbers.formatDecimal(juego.precio, 1, 2)}">$0.00</span>
                        <a th:href="@{'/detalle/' + ${juego.id}}" class="btn btn-outline-dark btn-sm">Ver Detalle</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="py-4 bg-dark text-white-50 text-center">
    <div class="container"><small>&copy; 2026 GameStore - Proyecto IS2</small></div>
</footer>

</body>
</html>
