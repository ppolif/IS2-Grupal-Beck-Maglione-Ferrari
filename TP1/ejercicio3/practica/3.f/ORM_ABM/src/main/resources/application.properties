# H2
#mem para que sea una BD en RAM y DB_CLOSE_DELAY=-1 para que no destruya la BD aunque no hayan conexiones abiertas
#file para que se almacene la base de datos en un archivo y persista ante la detencion de la app
spring.datasource.url=jdbc:h2:file:./data/minimarketdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola Web de H2 en localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true