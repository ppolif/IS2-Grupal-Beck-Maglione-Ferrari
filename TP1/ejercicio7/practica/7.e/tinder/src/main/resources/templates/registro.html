<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Tinder de Mascota - Registro</title>

  <!-- Bootstrap core CSS -->
  <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom fonts -->
  <link href="https://fonts.googleapis.com/css?family=Catamaran:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Lato:100,100i,300,300i,400,400i,700,700i,900,900i" rel="stylesheet">

  <!-- Custom styles -->
  <link th:href="@{/css/one-page-wonder.min.css}" href="/css/one-page-wonder.min.css" rel="stylesheet">
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Tinder de Mascota</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/registro}">Registro</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/login}">Log In</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<header class="masthead text-center text-white">
  <div class="masthead-content">
    <div class="container">
      <h1 class="masthead-heading mb-0">Tinder de Mascota</h1>
      <h2 class="masthead-subheading mb-0">Encontrale pareja a tu choco.</h2>
      <a th:href="@{/registro}" class="btn btn-primary btn-xl rounded-pill mt-5">¡Registrate!</a>
    </div>
  </div>
  <div class="bg-circle-1 bg-circle"></div>
  <div class="bg-circle-2 bg-circle"></div>
  <div class="bg-circle-3 bg-circle"></div>
  <div class="bg-circle-4 bg-circle"></div>
</header>

<section>
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-6 order-lg-2">
        <div class="p-5">
          <img class="img-fluid rounded-circle" th:src="@{/img/m1.jpeg}" src="/img/m1.jpeg" alt="Registro">
        </div>
      </div>
      <div class="col-lg-6 order-lg-1">
        <div class="p-5">
          <h2 class="display-4">Registrate</h2>
          <form th:action="@{/registrar}" method="POST" enctype="multipart/form-data">

            <p th:if="${error != null}" th:text="${error}" style="color:red;"></p>

            <label>Nombre</label>
            <input type="text" class="form-control" name="nombre" th:value="${nombre}" required/>

            <label>Apellido</label>
            <input type="text" class="form-control" name="apellido" th:value="${apellido}" required/>

            <label>E-Mail</label>
            <input type="email" class="form-control" name="email" th:value="${email}" required/>

            <label>Foto</label>
            <input type="file" class="form-control" name="archivo"/>

            <label>Zona</label>
            <select class="form-control" name="idZona" required>
              <option th:each="zona : ${zonas}" th:value="${zona.id}" th:text="${zona.nombre}" th:selected="${idZona != null && idZona == zona.id}"></option>
            </select>

            <label>Clave</label>
            <input type="password" class="form-control" name="clave" th:value="${clave}" required/>

            <label>Repetir Clave</label>
            <input type="password" class="form-control" name="repetirClave" th:value="${repetirClave}" required/>

            <br/><button type="submit" class="btn btn-primary">Registrarme</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="py-5 bg-black">
  <div class="container">
    <p class="m-0 text-center text-white small">Copyright &copy; Tinder de Mascota 2026</p>
  </div>
</footer>

<!-- Bootstrap core JavaScript -->
<script th:src="@{/vendor/jquery/jquery.min.js}" src="/vendor/jquery/jquery.min.js"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}" src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
