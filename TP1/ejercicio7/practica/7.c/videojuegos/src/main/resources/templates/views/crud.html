<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
    <title>CRUD Videojuegos</title>
</head>
<body>
<nav th:replace="components/navbar :: nav_bar"></nav>
<div class="container">
    <div class="row my-5">
        <div class="col-6">
            <h4>Administración de Videojuegos</h4>
        </div>
        <div class="col-6 d-flex flex-row-reverse">
            <a th:href="@{/formulario/videojuego/0}" class="btn btn-success">Agregar Videojuego</a>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <table class="table table-striped table-bordered align-middle">
                <thead class="thead-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Título</th>
                    <th scope="col">Precio</th>
                    <th scope="col">Stock</th>
                    <th scope="col">Categoría</th>
                    <th scope="col">Estudio</th>
                    <th scope="col" class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="videojuego : ${videojuegos}">
                    <td th:text="${videojuego.id}"></td>
                    <td th:text="${videojuego.titulo}"></td>
                    <td th:text="'$' + ${videojuego.precio}"></td>
                    <td th:text="${videojuego.stock}"></td>
                    <td th:text="${videojuego.nombreCategoria != null ? videojuego.nombreCategoria : '-'}"></td>
                    <td th:text="${videojuego.nombreEstudio != null ? videojuego.nombreEstudio : '-'}"></td>
                    <td class="text-center">
                        <a th:href="@{/formulario/videojuego/{id}(id=${videojuego.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/formulario/eliminar/{id}(id=${videojuego.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(videojuegos)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay videojuegos registrados en la base de datos.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
