<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Tinder de Mascota - Editar Perfil</title>

  <!-- Bootstrap core CSS -->
  <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom fonts -->
  <link href="https://fonts.googleapis.com/css?family=Catamaran:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Lato:100,100i,300,300i,400,400i,700,700i,900,900i" rel="stylesheet">

  <!-- Custom styles -->
  <link th:href="@{/css/one-page-wonder.min.css}" href="/css/one-page-wonder.min.css" rel="stylesheet">
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Tinder de Mascota</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/inicio}">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/logout}">Salir</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<header>
  <h1 style="margin-top:100px; text-align: center;">Editar Perfil</h1>
</header>

<section>
  <div class="container">
    <div class="row align-items-center">
      <!-- bloque nuevo de imagen porque cambio la logicaaaaa -->
      <div class="col-lg-6 order-lg-2">
        <div class="p-5 text-center">
          <img th:if="${usuarioEdicionDTO.tieneFoto}" class="img-fluid rounded-circle"
               th:src="@{/foto/usuario(id=${usuarioEdicionDTO.id})}"
               style="width: 250px; height: 250px; object-fit: cover;" alt="Foto Perfil">

          <img th:unless="${usuarioEdicionDTO.tieneFoto}" class="img-fluid rounded-circle"
               th:src="@{/img/m1.jpeg}"
               style="width: 250px; height: 250px; object-fit: cover;" alt="Foto por defecto">
        </div>

      <div class="col-lg-6 order-lg-1">
        <div class="p-5">
          <form th:action="@{/usuario/actualizar-perfil}" method="POST" enctype="multipart/form-data" th:object="${usuarioEdicionDTO}">

            <p th:if="${error != null}" th:text="${error}" style="color:red;"></p>

            <input type="hidden" th:field="*{id}"/>

            <label>Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required/>

            <label>Apellido</label>
            <input type="text" class="form-control" th:field="*{apellido}" required/>

            <label>E-Mail</label>
            <input type="email" class="form-control" th:field="*{mail}" required/>

            <label>Foto</label>
            <input type="file" class="form-control" th:field="*{archivo}"/>

            <label>Zona</label>
            <select class="form-control" th:field="*{idZona}" required>
              <option th:each="zona : ${zonas}" th:value="${zona.id}" th:text="${zona.nombre}" th:selected="${perfil?.zona != null && zona.id == perfil.zona.id}"></option>
            </select>

            <label>Nueva Clave</label>
            <input type="password" class="form-control" th:field="*{clave1}" required/>

            <label>Repetir Nueva Clave</label>
            <input type="password" class="form-control" th:field="*{clave2}" required/>

            <br/><button type="submit" class="btn btn-primary">Actualizar Perfil</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="py-5 bg-black mt-5">
  <div class="container">
    <p class="m-0 text-center text-white small">Copyright &copy; Tinder de Mascota 2026</p>
  </div>
</footer>

<!-- Bootstrap core JavaScript -->
<script th:src="@{/vendor/jquery/jquery.min.js}" src="/vendor/jquery/jquery.min.js"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}" src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
