<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
  <title th:text="${videojuego.id != null and videojuego.id > 0} ? 'Editar Videojuego' : 'Nuevo Videojuego'">Formulario Videojuego</title>
</head>
<body>
<nav th:replace="components/navbar :: nav_bar"></nav>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0" th:text="${videojuego.id != null and videojuego.id > 0} ? 'Modificar Videojuego' : 'Registrar Nuevo Videojuego'"></h4>
        </div>
        <div class="card-body">
          <form th:action="@{/formulario/videojuego/{id}(id=${videojuego.id != null ? videojuego.id : 0})}"
                th:object="${videojuego}"
                method="POST"
                enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}">

            <div class="form-group">
              <label for="titulo">Título</label>
              <input type="text" class="form-control" id="titulo" th:field="*{titulo}" placeholder="Ej: The Witcher 3">
              <small class="text-danger" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></small>
            </div>

            <div class="form-group">
              <label for="descripcion">Descripción</label>
              <textarea class="form-control" id="descripcion" rows="3" th:field="*{descripcion}" placeholder="Breve sinopsis o detalles"></textarea>
              <small class="text-danger" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small>
            </div>

            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="precio">Precio</label>
                <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}" placeholder="0.00">
                <small class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></small>
              </div>
              <div class="form-group col-md-6">
                <label for="stock">Stock</label>
                <input type="number" class="form-control" id="stock" th:field="*{stock}" placeholder="0">
                <small class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></small>
              </div>
              <div class="form-group col-md-4">
                <label for="fechaLanzamiento">Fecha de Lanzamiento</label>
                <input type="date" class="form-control" id="fechaLanzamiento" th:field="*{fechaLanzamiento}">
                <small class="text-danger" th:if="${#fields.hasErrors('fechaLanzamiento')}" th:errors="*{fechaLanzamiento}"></small>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="idCategoria">Categoría</label>
                <select class="form-control" id="idCategoria" th:field="*{idCategoria}">
                  <option value="" disabled selected>Seleccione una categoría</option>
                  <option th:each="cat : ${categorias}"
                          th:value="${cat.id}"
                          th:text="${cat.nombre}">
                  </option>
                </select>
                <small class="text-danger" th:if="${#fields.hasErrors('idCategoria')}" th:errors="*{idCategoria}"></small>
              </div>

              <div class="form-group col-md-6">
                <label for="idEstudio">Estudio Desarrollador</label>
                <select class="form-control" id="idEstudio" th:field="*{idEstudio}">
                  <option value="" disabled selected>Seleccione un estudio</option>
                  <option th:each="est : ${estudios}"
                          th:value="${est.id}"
                          th:text="${est.nombre}">
                  </option>
                </select>
                <small class="text-danger" th:if="${#fields.hasErrors('idEstudio')}" th:errors="*{idEstudio}"></small>
              </div>
            </div>

            <div class="form-group">
              <label for="imagen">Carátula / Portada</label>
              <input type="file" class="form-control-file" id="imagen" th:field="*{imagen}" accept="image/*">
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a th:href="@{/crud}" class="btn btn-secondary">Cancelar</a>
              <button type="submit" class="btn btn-success" th:text="${videojuego.id != null and videojuego.id > 0} ? 'Guardar Cambios' : 'Registrar'"></button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
</body>
</html>
