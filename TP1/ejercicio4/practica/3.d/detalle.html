<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!--ICONOS-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
    <nav class="navbar navbar-expand-md navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Gran Sabor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 md-md-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Inicio</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Categorias
                        </a>
                        <div class="dropdown-menu" aria-labelledby="categoriasDropdown">
                            <a class="dropdown-item" href="">Pizzas</a>
                            <a class="dropdown-item" href="">Empanadas</a>
                            <a class="dropdown-item" href="">Bebidas</a>
                        </div>
                    </li>
                </ul>

                <div class="d-md-none">
                    <ul class="navbar-nav me-auto-mb-2 mb-md-0">
                        <li class="nav-item">
                            <a class="nav-link" href="">Carrito</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="">Perfil</a>
                        </li>
                    </ul>
                </div>

                <div class="d-none d-md-flex gap-2">
                    <a class="nav-item nav-link p-1" href="">
                        <i class="bi bi-basket" style="font-size: 1.2rem"></i>
                    </a>
                    <a class="nav-item nav-link p-1" href="">
                        <i class="bi bi-person" style="font-size: 1.2rem"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!--SECCION PRODUCTO-->
    <section class="py-5 mt-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="row gx-4 gx-lg-5 align-items-center">
                <div class="col-md-6">
                <img 
                    id="product-image" 
                    src="https://i.ytimg.com/vi/Lg1sTUj6p7o/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLDpSkUNQNf6AsQ9AP8LwHSZ6MxgYg" 
                    alt=""
                    class="cad-img-top mb-5 mb-md-0">
            </div>
            <div class="col-md-6">
                <h1 id="product-title" class="display-5 fw-bolder">Articulo</h1>
                <div class="f5-5 mb-5">
                    <span id="product-price">$10</span>
                </div>
                <p id="product-description" class="lead">parrafoparrafo parrafoparrafo parrafoparrafo parrafoparrafo</p>
                <div class="d-flex">
                    <input type="text" class="form-control text-center me-3" id="inputQuantity" type="num" value="1" style="max-width: 3.5rem;">
                    <button class="btn btn-outline-success flex-shrink-0" type="button">
                        <i class="bi bi-basket"></i>
                        Añadir al carrito
                    </button>
                </div>
            </div>
            </div>
            
        </div>
    </section>

    <section class="py-5 bg-light">
        <div class="container px-4 px-lg-5 mt-5">
            <h2 class="fw-bolder mb-4">Productos relacionados</h2>
            <div id="productos-relacionados" class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 justify-content-center">
                <!--Renderizamos productos-->
            </div>
        </div>
    </section>
    <div class="container">
        <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
            <div class="d-flex align-items-center text-secondary">
                <a href="/" class="text-secondary text-decoration-none fw-bold me-2">Gran Sabor</a>
                <span>&copy; 2026 LCC Maglione-Ferrari-CeredaBeck</span>
            </div>

            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3"><a class="text-body-secondary">icono facebook</a></li>
                <li class="ms-3"><a class="text-body-secondary">icono instagram</a></li>
            </ul>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script type="module" src="lib/pages/detalle.js"></script>

</body>
</html>
