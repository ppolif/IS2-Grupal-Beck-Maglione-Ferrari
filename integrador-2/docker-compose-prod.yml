services:
  db:
    image: mysql:8.0
    container_name: dulcemayor-mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=64M --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dulcemayor-backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx450m -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      APP_JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET}
      MERCADOPAGO_API_URL: ${MERCADOPAGO_API_URL}
      MERCADOPAGO_QR_EXPIRATION_MINUTES: ${MERCADOPAGO_QR_EXPIRATION_MINUTES:-15}
      DULCEMAYOR_BANCO_NOMBRE: ${DULCEMAYOR_BANCO_NOMBRE}
      DULCEMAYOR_BANCO_TITULAR: ${DULCEMAYOR_BANCO_TITULAR}
      DULCEMAYOR_BANCO_CUIT: ${DULCEMAYOR_BANCO_CUIT}
      DULCEMAYOR_BANCO_CBU: ${DULCEMAYOR_BANCO_CBU}
      DULCEMAYOR_BANCO_ALIAS: ${DULCEMAYOR_BANCO_ALIAS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - backend_uploads:/app/uploads

volumes:
  db_data:
  backend_uploads: