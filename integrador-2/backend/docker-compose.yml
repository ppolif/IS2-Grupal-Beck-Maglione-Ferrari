version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: dulcemayor-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dulcemayor_db
      MYSQL_USER: dulcemayor_user
      MYSQL_PASSWORD: dulcemayor_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build: .
    container_name: dulcemayor-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/dulcemayor_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: dulcemayor_user
      SPRING_DATASOURCE_PASSWORD: dulcemayor_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  db_data: