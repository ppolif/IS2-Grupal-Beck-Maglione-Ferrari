        detalles:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/DetallePedidoRequest'}
      required: [puntoDeVentaId, detalles]
      description: El preventor se toma del usuario autenticado (o se informa si lo carga el jefe). El precio unitario lo fija el backend con la VigenciaPrecio vigente; el cliente nunca envía precios.
    PedidoUpdateRequest:
      type: object
      properties:
        codigoPromocion: {type: string, nullable: true}
        detalles:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/DetallePedidoRequest'}
      required: [detalles]
      description: Solo permitido mientras el pedido está en CARGADO.
    DetallePedidoResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        productoId: {type: string, format: uuid}
        productoNombre: {type: string}
        presentacion: {type: string}
        cantidad: {type: integer, format: int32}
        precioUnitario: {type: number, format: double}
        subtotal: {type: number, format: double}
    PedidoResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        numeroPedido: {type: integer, format: int64}
        fechaHoraCarga: {type: string, format: date-time}
        estado: {$ref: '#/components/schemas/EstadoPedido'}
        puntoDeVenta: {$ref: '#/components/schemas/PuntoDeVentaResponse'}
        preventor: {$ref: '#/components/schemas/EmpleadoResumen'}
