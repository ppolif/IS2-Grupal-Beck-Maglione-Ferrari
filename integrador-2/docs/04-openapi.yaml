openapi: 3.0.3
info:
  title: Dulce Mayor API
  version: 1.0.0
  description: |
    Contrato de la API REST de **Dulce Mayor** (TP Integrador N°2, Ingeniería del Software II, UNCuyo).
    Es la única interfaz que usan las tres aplicaciones cliente: dashboard administrativo, sitio institucional/portal del cliente y portal móvil de preventores y distribuidores.

    ## Convenciones
    - Prefijo `/api/v1`. Identificadores UUID. Fechas ISO 8601. Montos en pesos argentinos (`number`).
    - **Autenticación:** JWT en `Authorization: Bearer <token>`. Los endpoints marcados como públicos no lo requieren.
    - **Permisos:** cada operación declara `x-roles` (roles habilitados). `AUTENTICADO` = cualquier usuario con sesión. El backend debe traducirlo a `@PreAuthorize`.
    - **Clave temporal:** mientras `claveTemporal=true`, toda operación salvo `POST /auth/cambiar-clave` y `GET /auth/perfil` responde `403` con `code=CAMBIO_CLAVE_REQUERIDO`.
    - **Borrado lógico:** `DELETE` marca `eliminado=true`; los listados no devuelven eliminados.
    - **Paginación:** los listados grandes devuelven `{content, page, size, totalElements, totalPages}`. Los catálogos chicos (geografía, categorías, formas de pago, empresas) devuelven arreglos simples.
    - **Errores:** siempre `ErrorResponse` (`timestamp, status, code, message, path, errors[]`).
    - **Pedidos:** el cliente nunca envía precios; los fija el backend con la `VigenciaPrecio` vigente.
    - **Filtrado por dueño:** PREVENTISTA ve solo lo propio, DISTRIBUIDOR solo sus rutas, MINORISTA solo sus pedidos y facturas.
servers:
- {url: 'http://localhost:8080/api/v1', description: Desarrollo local}
security:
- bearerAuth: []
tags:
- {name: Autenticación}
- {name: Usuarios}
- {name: Personas}
- {name: Mayorista}
- {name: Imágenes}
- {name: Geografía}
- {name: Productos}
- {name: Stock}
- {name: Promociones}
- {name: Pedidos}
- {name: Portal del minorista}
- {name: Facturación y pagos}
- {name: Rutas}
- {name: Reportes}
- {name: Estadísticas}
- {name: Notificaciones}
- {name: Sitio público}
paths:
  /auth/cambiar-clave:
    post:
      tags: [Autenticación]
      operationId: modificarClave
      summary: Cambiar la propia clave
      x-roles: [AUTENTICADO]
      description: |-
        Es el **único** endpoint (junto con /auth/perfil) permitido mientras `claveTemporal=true`. La nueva clave no puede ser la clave por defecto.

        **Roles:** AUTENTICADO.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CambiarClaveRequest'}
      responses:
        '204': {description: Clave modificada}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Iniciar sesión (empleados y clientes)
      security: []
      x-roles: []
      description: |-
        Si el usuario aún tiene la clave temporal, la respuesta trae `debeCambiarClave=true`.

        **Acceso:** público (sin token).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/login-externo:
    post:
      tags: [Autenticación]
      operationId: loginExterno
      summary: Iniciar sesión con red social (clientes)
      security: []
      x-roles: []
      description: '**Acceso:** público (sin token).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginExternoRequest'}
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/perfil:
    get:
      tags: [Autenticación]
      operationId: perfil
      summary: Datos del usuario autenticado
      x-roles: [AUTENTICADO]
      description: '**Roles:** AUTENTICADO.'
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PerfilResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/registro:
    post:
      tags: [Autenticación]
      operationId: registrarMinorista
      summary: Registro de un minorista (cliente) en el portal
      security: []
      x-roles: []
      description: |-
        Crea Minorista + Usuario con rol MINORISTA. Si ya existe un Minorista cargado por un preventor con el mismo correo, se vincula.

        **Acceso:** público (sin token).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegistroMinoristaRequest'}
      responses:
        '201':
          description: Cliente registrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /categorias:
    get:
      tags: [Productos]
      operationId: listarCategoria
      summary: Listar categoria
      security: []
      x-roles: []
      description: '**Acceso:** público (sin token).'
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CategoriaResponse'}
    post:
      tags: [Productos]
      operationId: crearCategoria
      summary: Crear Categoria
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoriaRequest'}
      responses:
        '201':
          description: Categoria creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoriaResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /categorias/{id}:
    get:
      tags: [Productos]
      operationId: buscarCategoria
      summary: Buscar Categoria por id
      security: []
      x-roles: []
      description: '**Acceso:** público (sin token).'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Categoria
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoriaResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Productos]
      operationId: modificarCategoria
      summary: Modificar Categoria
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoriaRequest'}
      responses:
        '200':
          description: Categoria modificado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoriaResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Productos]
      operationId: eliminarCategoria
      summary: Eliminar Categoria (borrado lógico)
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Eliminado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /departamentos:
    get:
      tags: [Geografía]
      operationId: listarDepartamento
      summary: Listar departamento
      security: []
      x-roles: []
      description: '**Acceso:** público (sin token).'
      parameters:
      - name: provinciaId
        in: query
        required: false
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DepartamentoResponse'}
    post:
      tags: [Geografía]
      operationId: crearDepartamento
      summary: Crear Departamento
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DepartamentoRequest'}
      responses:
        '201':
          description: Departamento creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DepartamentoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /departamentos/{id}:
    get:
      tags: [Geografía]
      operationId: buscarDepartamento
      summary: Buscar Departamento por id
      security: []
      x-roles: []
      description: '**Acceso:** público (sin token).'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Departamento
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DepartamentoResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Geografía]
      operationId: modificarDepartamento
      summary: Modificar Departamento
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DepartamentoRequest'}
      responses:
        '200':
          description: Departamento modificado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DepartamentoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Geografía]
      operationId: eliminarDepartamento
      summary: Eliminar Departamento (borrado lógico)
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Eliminado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /empleados:
    get:
      tags: [Personas]
      operationId: listarEmpleado
      summary: Listar empleado
      x-roles: [JEFE, ADMINISTRATIVO]
      description: |-
        Filtrar por `rol=PREVENTISTA` o `rol=DISTRIBUIDOR` para poblar selectores.

        **Roles:** JEFE, ADMINISTRATIVO.
      parameters:
      - name: rol
        in: query
        required: false
        schema: {$ref: '#/components/schemas/RolEmpleado'}
      - name: legajo
        in: query
        required: false
        schema: {type: string}
        description: Búsqueda exacta por legajo (buscarPreventor / buscarDistribuidor)
      - name: q
        in: query
        required: false
        schema: {type: string}
        description: Nombre, apellido o documento
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Size'}
      - {$ref: '#/components/parameters/Sort'}
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmpleadoPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Personas]
      operationId: crearEmpleado
      summary: Crear Empleado
      x-roles: [JEFE]
      description: '**Roles:** JEFE.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmpleadoRequest'}
      responses:
        '201':
          description: Empleado creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmpleadoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /empleados/{id}:
    get:
      tags: [Personas]
      operationId: buscarEmpleado
      summary: Buscar Empleado por id
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Empleado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmpleadoResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Personas]
      operationId: modificarEmpleado
      summary: Modificar Empleado
      x-roles: [JEFE]
      description: '**Roles:** JEFE.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmpleadoRequest'}
      responses:
        '200':
          description: Empleado modificado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmpleadoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Personas]
      operationId: eliminarEmpleado
      summary: Eliminar Empleado (borrado lógico)
      x-roles: [JEFE]
      description: '**Roles:** JEFE.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Eliminado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /estadisticas/pedidos-por-preventor-por-dia:
    get:
      tags: [Estadísticas]
      operationId: estadisticaPedidosPorPreventorPorDia
      summary: 'Gráfico de barras: pedidos por preventor por día en un mes'
      x-roles: [JEFE]
      description: '**Roles:** JEFE.'
      parameters:
      - name: anio
        in: query
        required: true
        schema: {type: integer, format: int32}
      - name: mes
        in: query
        required: true
        schema: {type: integer, minimum: 1, maximum: 12}
      responses:
        '200':
          description: Series para el gráfico de barras
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PedidosPorPreventorPorDiaResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /estadisticas/stock-por-producto:
    get:
      tags: [Estadísticas]
      operationId: estadisticaStockPorProducto
      summary: 'Gráfico de torta: cantidad en stock por producto'
      x-roles: [JEFE]
      description: '**Roles:** JEFE.'
      responses:
        '200':
          description: Datos para el gráfico de torta
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/StockPorProductoItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /facturas:
    get:
      tags: [Facturación y pagos]
      operationId: listarFactura
      summary: Listar facturas
      x-roles: [JEFE, ADMINISTRATIVO]
      description: |-
        Las facturas se generan con `POST /pedidos/{id}/procesar`; no se crean a mano.

        **Roles:** JEFE, ADMINISTRATIVO.
      parameters:
      - name: estado
        in: query
        required: false
        schema: {$ref: '#/components/schemas/EstadoFactura'}
      - name: minoristaId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - {$ref: '#/components/parameters/Desde'}
      - {$ref: '#/components/parameters/Hasta'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Size'}
      - {$ref: '#/components/parameters/Sort'}
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FacturaPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /facturas/{id}:
    get:
      tags: [Facturación y pagos]
      operationId: buscarFactura
      summary: Buscar factura
      x-roles: [JEFE, ADMINISTRATIVO, MINORISTA]
      description: |-
        El MINORISTA solo accede a facturas propias.

        **Roles:** JEFE, ADMINISTRATIVO, MINORISTA.
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Factura
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FacturaResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /facturas/{id}/anular:
    post:
      tags: [Facturación y pagos]
      operationId: anularFactura
      summary: Anular factura
      x-roles: [JEFE, ADMINISTRATIVO]
      description: |-
        No se puede anular una factura con pagos registrados (409).

        **Roles:** JEFE, ADMINISTRATIVO.
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Factura anulada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FacturaResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /facturas/{id}/pagos:
    get:
      tags: [Facturación y pagos]
      operationId: listarPagoPorFactura
      summary: Pagos de una factura
      x-roles: [JEFE, ADMINISTRATIVO, MINORISTA]
      description: '**Roles:** JEFE, ADMINISTRATIVO, MINORISTA.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Pagos
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PagoResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Facturación y pagos]
      operationId: registrarPago
      summary: Registrar un pago
      x-roles: [JEFE, ADMINISTRATIVO]
      description: |-
        Si la suma de pagos cubre el total, la factura pasa a PAGADA. 409 si la factura está ANULADA o el monto excede el saldo.

        **Roles:** JEFE, ADMINISTRATIVO.
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PagoRequest'}
      responses:
        '201':
          description: Pago registrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PagoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /facturas/{id}/pdf:
    get:
      tags: [Facturación y pagos]
      operationId: descargarFacturaPdf
      summary: Descargar la factura electrónica en PDF
      x-roles: [JEFE, ADMINISTRATIVO, MINORISTA]
      description: |-
        El MINORISTA solo descarga facturas propias.

        **Roles:** JEFE, ADMINISTRATIVO, MINORISTA.
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: PDF de la factura
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /facturas/{id}/qr-pago:
    get:
      tags: [Facturación y pagos]
      operationId: generarQrPago
      summary: QR para pagar con billetera virtual
      x-roles: [JEFE, ADMINISTRATIVO, MINORISTA]
      description: |-
        El QR es simulado (no hay integración con pasarelas reales): codifica el número de factura, el saldo y una referencia. 409 si la factura no está PENDIENTE_PAGO.

        **Roles:** JEFE, ADMINISTRATIVO, MINORISTA.
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Imagen PNG del QR
          content:
            image/png:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /facturas/{id}/reenviar-correo:
    post:
      tags: [Facturación y pagos]
      operationId: reenviarFacturaPorCorreo
      summary: Reenviar la factura por correo al responsable del comercio
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Correo enviado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /formas-de-pago:
    get:
      tags: [Facturación y pagos]
      operationId: listarFormaDePago
      summary: Listar formadepago
      x-roles: [AUTENTICADO]
      description: '**Roles:** AUTENTICADO.'
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
