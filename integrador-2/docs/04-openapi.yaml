          allOf:
          - {$ref: '#/components/schemas/PuntoDeVentaResponse'}
          nullable: true
          description: PuntoDeVenta que se está atendiendo (Ruta.paradaActual). Nulo si la ruta no tiene paradas pendientes.
        responsable: {$ref: '#/components/schemas/EmpleadoResumen'}
        paradas:
          type: array
          items: {$ref: '#/components/schemas/ParadaResponse'}
      description: 'Estado: PENDIENTE al crearse; REALIZADA cuando todas las paradas se completaron; INCOMPLETA si se cerró con paradas sin completar.'
