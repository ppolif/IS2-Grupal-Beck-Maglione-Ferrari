    PromocionRequest:
      type: object
      properties:
        codigo: {type: string}
        descripcion: {type: string}
        porcentajeDescuento: {type: number, format: double, minimum: 0, maximum: 100}
        cantidadMinima: {type: integer, nullable: true, description: Descuento por volumen (opcional).}
        productoId: {type: string, format: uuid, nullable: true, description: Producto destacado (opcional).}
        fechaDesde: {type: string, format: date}
        fechaHasta: {type: string, format: date}
      required: [codigo, porcentajeDescuento, fechaDesde, fechaHasta]
    PromocionResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        codigo: {type: string}
        descripcion: {type: string}
        porcentajeDescuento: {type: number, format: double}
        cantidadMinima: {type: integer, format: int32}
        productoId: {type: string, format: uuid}
        productoNombre: {type: string}
        fechaDesde: {type: string, format: date}
        fechaHasta: {type: string, format: date}
    FormaDePagoRequest:
      type: object
      properties:
        tipoPago: {$ref: '#/components/schemas/TipoPago'}
        observacion: {type: string, description: Ej. alias bancario para TRANSFERENCIA.}
      required: [tipoPago]
    FormaDePagoResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
