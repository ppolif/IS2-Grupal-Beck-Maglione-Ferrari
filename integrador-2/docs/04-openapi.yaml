        unidadesPorBulto: {type: integer, format: int32}
        enOferta: {type: boolean}
        imagenId: {type: string, format: uuid}
        subCategoriaId: {type: string, format: uuid}
        subCategoriaNombre: {type: string}
        categoriaId: {type: string, format: uuid}
        categoriaNombre: {type: string}
        precioVigente: {type: number, format: double}
        stockActual: {type: integer, format: int32}
    ProductoPublicoResponse:
