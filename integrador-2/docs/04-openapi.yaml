        monto: {type: number, format: double}
        fechaPago: {type: string, format: date-time}
        referencia: {type: string}
        observacion: {type: string}
    FacturaResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        numeroFactura: {type: integer, format: int64}
        fechaFactura: {type: string, format: date-time}
        pedidoId: {type: string, format: uuid}
        estado: {$ref: '#/components/schemas/EstadoFactura'}
        total: {type: number, format: double}
        totalPagado: {type: number, format: double}
