      required: [fechaDesde, precio]
    VigenciaPrecioResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        productoId: {type: string, format: uuid}
        fechaDesde: {type: string, format: date}
        fechaHasta: {type: string, format: date, nullable: true}
        precio: {type: number, format: double}
    StockResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        productoId: {type: string, format: uuid}
        productoNombre: {type: string}
        cantidadActual: {type: integer, format: int32}
        observacion: {type: string}
        fechaHora: {type: string, format: date-time}
    StockAjusteRequest:
      type: object
