        latitudInicial: {type: number, format: double}
        longitudInicial: {type: number, format: double}
      required: [fecha]
      description: Genera la ruta con los puntos de venta asignados al preventor, ordenados por vecino más cercano (haversine) desde la posición inicial.
    RutaDistribuidorRequest:
      type: object
      properties:
        distribuidorId: {type: string, format: uuid}
        fecha: {type: string, format: date}
        pedidoIds:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
          description: Pedidos en estado FACTURADO.
      required: [distribuidorId, fecha, pedidoIds]
      description: Crea la ruta (PENDIENTE), ordena las paradas, pasa los pedidos a EN_REPARTO (con registro en el historial) y asigna `Pedido.distribuidor`.
