          description: Se completa solo cuando el pedido entra a una RutaDistribuidor; nunca se carga a mano.
        codigoPromocion: {type: string}
        subtotal: {type: number, format: double}
        descuento: {type: number, format: double}
        total: {type: number, format: double}
        detalles:
          type: array
          items: {$ref: '#/components/schemas/DetallePedidoResponse'}
        facturaId: {type: string, format: uuid, nullable: true, description: 'Se resuelve por consulta (buscarFacturaPorPedido): en el dominio la Factura guarda al Pedido.'}
    HistorialEstadoPedidoResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        estado: {$ref: '#/components/schemas/EstadoPedido'}
        fechaHora: {type: string, format: date-time}
        usuario: {type: string}
        observacion: {type: string}
    AnularPedidoRequest:
      type: object
      properties:
        observacion: {type: string}
