        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /subcategorias/{id}:
    get:
      tags: [Productos]
      operationId: buscarSubCategoria
      summary: Buscar SubCategoria por id
      security: []
      x-roles: []
      description: '**Acceso:** público (sin token).'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: SubCategoria
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubCategoriaResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Productos]
      operationId: modificarSubCategoria
      summary: Modificar SubCategoria
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubCategoriaRequest'}
      responses:
        '200':
          description: SubCategoria modificado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubCategoriaResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Productos]
      operationId: eliminarSubCategoria
      summary: Eliminar SubCategoria (borrado lógico)
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Eliminado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuario
      summary: Listar usuarios
      x-roles: [JEFE]
      description: |-
        Los usuarios se crean junto con su persona: empleados en `POST /empleados`, clientes en `/auth/registro`.

        **Roles:** JEFE.
      parameters:
      - name: rol
        in: query
        required: false
        schema: {$ref: '#/components/schemas/RolUsuario'}
      - name: q
        in: query
        required: false
        schema: {type: string}
        description: Busca por nombre de usuario
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Size'}
      - {$ref: '#/components/parameters/Sort'}
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsuarioPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /usuarios/{id}:
    get:
      tags: [Usuarios]
      operationId: buscarUsuario
      summary: Buscar usuario
      x-roles: [JEFE]
      description: '**Roles:** JEFE.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsuarioResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Usuarios]
      operationId: modificarUsuario
      summary: Modificar nombre de usuario o rol
      x-roles: [JEFE]
      description: '**Roles:** JEFE.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UsuarioUpdateRequest'}
      responses:
        '200':
          description: Usuario modificado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsuarioResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Usuarios]
      operationId: eliminarUsuario
      summary: Eliminar usuario (borrado lógico)
      x-roles: [JEFE]
      description: '**Roles:** JEFE.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Eliminado}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /usuarios/{id}/restablecer-clave:
    post:
      tags: [Usuarios]
      operationId: restablecerClave
      summary: Restablecer la clave por defecto
      x-roles: [JEFE]
      description: '**Roles:** JEFE.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Clave restablecida; el usuario deberá cambiarla en el próximo ingreso}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /vigencias-precio/{id}:
    put:
      tags: [Productos]
      operationId: modificarVigenciaPrecio
      summary: Modificar una vigencia de precio
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VigenciaPrecioRequest'}
      responses:
        '200':
          description: Vigencia modificada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VigenciaPrecioResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Productos]
      operationId: eliminarVigenciaPrecio
      summary: Eliminar una vigencia de precio
      x-roles: [JEFE, ADMINISTRATIVO]
      description: '**Roles:** JEFE, ADMINISTRATIVO.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Eliminada}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
      description: Identificador del recurso (UUID).
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
      description: Número de página (base 0).
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      description: Tamaño de página.
    Sort:
      name: sort
      in: query
      schema: {type: string, example: 'nombre,asc'}
      description: 'Orden: campo,asc|desc.'
    Desde:
      name: desde
      in: query
      schema: {type: string, format: date}
    Hasta:
      name: hasta
      in: query
      schema: {type: string, format: date}
    Fecha:
      name: fecha
      in: query
      schema: {type: string, format: date}
      description: Por defecto, hoy.
    Formato:
      name: formato
      in: query
      schema: {$ref: '#/components/schemas/FormatoReporte'}
      description: json (pantalla), pdf o xlsx. Por defecto json.
  responses:
    BadRequest:
      description: Datos inválidos (code=VALIDACION) o regla de negocio incumplida.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: Token ausente, inválido o vencido.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Sin permiso para el rol, o cambio de clave pendiente (code=CAMBIO_CLAVE_REQUERIDO).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Recurso inexistente (code=NO_ENCONTRADO).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Conflicto de estado o duplicado (code=TRANSICION_INVALIDA, STOCK_INSUFICIENTE, DUPLICADO).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    TipoDocumento:
      type: string
      enum: [DNI, CUIT, PASAPORTE]
    TipoContacto:
      type: string
      enum: [PERSONAL, LABORAL, EMPRESA]
    TipoTelefono:
      type: string
      enum: [FIJO, CELULAR]
    TipoEmpresa:
      type: string
      enum: [SEDE_CENTRAL, SUCURSAL]
    TipoImagen:
      type: string
      enum: [PRODUCTO, SUCURSAL, LOGO_EMPRESA]
    RolUsuario:
      type: string
      enum: [ADMINISTRATIVO, JEFE, PREVENTISTA, MINORISTA, DISTRIBUIDOR]
    RolEmpleado:
      type: string
      enum: [ADMINISTRATIVO, JEFE, PREVENTISTA, DISTRIBUIDOR]
    ProveedorAuth:
      type: string
      enum: [LOCAL, GOOGLE, FACEBOOK]
    EstadoPedido:
      type: string
      enum: [CARGADO, SIN_STOCK, FACTURADO, EN_REPARTO, ENTREGADO, ANULADO]
    EstadoFactura:
      type: string
      enum: [PENDIENTE_PAGO, PAGADA, ANULADA]
    TipoPago:
      type: string
      enum: [EFECTIVO, TRANSFERENCIA, BILLETERA_VIRTUAL]
    RutaEstado:
      type: string
      enum: [REALIZADA, PENDIENTE, INCOMPLETA]
    TipoRuta:
      type: string
      enum: [PREVENTOR, DISTRIBUIDOR]
    FormatoReporte:
      type: string
      enum: [json, pdf, xlsx]
    ErrorResponse:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer, format: int32}
        code: {type: string, description: 'Código de error estable para el frontend (ej. VALIDACION, NO_ENCONTRADO, CAMBIO_CLAVE_REQUERIDO, STOCK_INSUFICIENTE, TRANSICION_INVALIDA).'}
        message: {type: string}
        path: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              campo: {type: string}
              mensaje: {type: string}
      required: [timestamp, status, code, message, path]
    DireccionRequest:
      type: object
      properties:
        calle: {type: string}
        numeracion: {type: string}
        barrio: {type: string}
        manzanaPiso: {type: string}
        casaDepartamento: {type: string}
        referencia: {type: string}
        latitud: {type: number, format: double, minimum: -90, maximum: 90}
        longitud: {type: number, format: double, minimum: -180, maximum: 180}
        localidadId: {type: string, format: uuid}
      required: [calle, numeracion, localidadId]
    DireccionResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        calle: {type: string}
        numeracion: {type: string}
        barrio: {type: string}
        manzanaPiso: {type: string}
        casaDepartamento: {type: string}
        referencia: {type: string}
        latitud: {type: number, format: double}
        longitud: {type: number, format: double}
        localidadId: {type: string, format: uuid}
        localidadNombre: {type: string}
        departamentoId: {type: string, format: uuid}
        departamentoNombre: {type: string}
        provinciaNombre: {type: string}
    ContactoRequest:
      type: object
      properties:
        medio:
          type: string
          enum: [CORREO, TELEFONICO]
          description: Define qué subclase de Contacto se crea.
        tipoContacto: {$ref: '#/components/schemas/TipoContacto'}
        observacion: {type: string}
        email: {type: string, format: email, description: Obligatorio si medio=CORREO.}
        telefono: {type: string, description: Obligatorio si medio=TELEFONICO.}
        tipoTelefono: {$ref: '#/components/schemas/TipoTelefono'}
      required: [medio, tipoContacto]
    ContactoResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        medio:
          type: string
          enum: [CORREO, TELEFONICO]
        tipoContacto: {$ref: '#/components/schemas/TipoContacto'}
        observacion: {type: string}
        email: {type: string}
        telefono: {type: string}
        tipoTelefono: {$ref: '#/components/schemas/TipoTelefono'}
    UsuarioResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombreUsuario: {type: string}
        rol: {$ref: '#/components/schemas/RolUsuario'}
        claveTemporal: {type: boolean, description: true mientras la clave sea la temporal por defecto.}
        proveedorAuth: {$ref: '#/components/schemas/ProveedorAuth'}
    UsuarioUpdateRequest:
      type: object
      properties:
        nombreUsuario: {type: string}
        rol: {$ref: '#/components/schemas/RolUsuario'}
      required: [nombreUsuario, rol]
    LoginRequest:
      type: object
      properties:
        nombreUsuario: {type: string}
        clave: {type: string, format: password}
      required: [nombreUsuario, clave]
    LoginExternoRequest:
      type: object
      properties:
        proveedor:
          type: string
          enum: [GOOGLE, FACEBOOK]
        tokenExterno: {type: string, description: Token de identidad entregado por el proveedor OAuth2.}
      required: [proveedor, tokenExterno]
    AuthResponse:
      type: object
      properties:
        token: {type: string}
        tipo: {type: string, example: Bearer}
        expiraEn: {type: integer, description: Segundos hasta que expira el token.}
        debeCambiarClave: {type: boolean, description: 'Si es true, el frontend debe llevar al usuario a cambiar la clave: el backend rechaza todo otro endpoint con 403 CAMBIO_CLAVE_REQUERIDO.'}
        usuario: {$ref: '#/components/schemas/UsuarioResponse'}
      required: [token, tipo, expiraEn, debeCambiarClave, usuario]
    RegistroMinoristaRequest:
      type: object
      properties:
        nombre: {type: string}
        apellido: {type: string}
        tipoDocumento: {$ref: '#/components/schemas/TipoDocumento'}
        numeroDocumento: {type: string}
        email: {type: string, format: email}
        clave: {type: string, format: password, minLength: 8}
        nombreComercio: {type: string, description: 'Opcional: se informa para facilitar la carga posterior de puntos de venta.'}
      required: [nombre, apellido, tipoDocumento, numeroDocumento, email, clave]
    CambiarClaveRequest:
      type: object
      properties:
        claveActual: {type: string, format: password}
        nuevaClave: {type: string, format: password, minLength: 8}
        confirmarClave: {type: string, format: password}
      required: [claveActual, nuevaClave, confirmarClave]
    PerfilResponse:
      type: object
      properties:
        usuario: {$ref: '#/components/schemas/UsuarioResponse'}
        personaId: {type: string, format: uuid}
        nombre: {type: string}
        apellido: {type: string}
      required: [usuario]
    EmpleadoRequest:
      type: object
      properties:
        nombre: {type: string}
        apellido: {type: string}
        fechaNacimiento: {type: string, format: date}
        tipoDocumento: {$ref: '#/components/schemas/TipoDocumento'}
        numeroDocumento: {type: string}
        direcciones:
          type: array
          items: {$ref: '#/components/schemas/DireccionRequest'}
        contactos:
          type: array
          items: {$ref: '#/components/schemas/ContactoRequest'}
        legajo: {type: string}
        nombreUsuario: {type: string}
        rol: {$ref: '#/components/schemas/RolEmpleado'}
      required: [nombre, apellido, tipoDocumento, numeroDocumento, legajo, nombreUsuario, rol]
      description: 'Crea al empleado y su Usuario. El Usuario nace con la clave por defecto y claveTemporal=true. Según el rol el backend instancia la clase: PREVENTISTA -> Preventor, DISTRIBUIDOR -> Distribuidor,
        ADMINISTRATIVO y JEFE -> Empleado.'
    EmpleadoResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        legajo: {type: string}
        nombre: {type: string}
        apellido: {type: string}
        fechaNacimiento: {type: string, format: date}
        tipoDocumento: {$ref: '#/components/schemas/TipoDocumento'}
        numeroDocumento: {type: string}
        direcciones:
          type: array
          items: {$ref: '#/components/schemas/DireccionResponse'}
        contactos:
          type: array
          items: {$ref: '#/components/schemas/ContactoResponse'}
        usuario: {$ref: '#/components/schemas/UsuarioResponse'}
    EmpleadoResumen:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        apellido: {type: string}
        rol: {$ref: '#/components/schemas/RolUsuario'}
    MinoristaRequest:
      type: object
      properties:
        nombre: {type: string}
        apellido: {type: string}
        fechaNacimiento: {type: string, format: date}
        tipoDocumento: {$ref: '#/components/schemas/TipoDocumento'}
        numeroDocumento: {type: string}
        direcciones:
          type: array
          items: {$ref: '#/components/schemas/DireccionRequest'}
        contactos:
          type: array
          items: {$ref: '#/components/schemas/ContactoRequest'}
      required: [nombre, apellido, tipoDocumento, numeroDocumento]
      description: Minorista = cliente. Se crea sin Usuario; cuando se registra en el portal con el mismo correo, el sistema vincula ambos. Se recomienda cargar al menos un contacto de correo (se usa para
        las notificaciones).
    MinoristaResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        apellido: {type: string}
        fechaNacimiento: {type: string, format: date}
        tipoDocumento: {$ref: '#/components/schemas/TipoDocumento'}
        numeroDocumento: {type: string}
        direcciones:
          type: array
          items: {$ref: '#/components/schemas/DireccionResponse'}
        contactos:
          type: array
          items: {$ref: '#/components/schemas/ContactoResponse'}
        tieneUsuario: {type: boolean}
    MinoristaResumen:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        apellido: {type: string}
        email: {type: string}
    PuntoDeVentaRequest:
      type: object
      properties:
        nombreComercio: {type: string}
        minoristaId: {type: string, format: uuid}
        direccion: {$ref: '#/components/schemas/DireccionRequest'}
        preventorId: {type: string, format: uuid, description: Preventor asignado (opcional).}
      required: [nombreComercio, minoristaId, direccion]
    PuntoDeVentaResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombreComercio: {type: string}
        minorista: {$ref: '#/components/schemas/MinoristaResumen'}
        direccion: {$ref: '#/components/schemas/DireccionResponse'}
        preventor: {$ref: '#/components/schemas/EmpleadoResumen'}
    MayoristaRequest:
      type: object
      properties:
        razonSocial: {type: string}
        cuit: {type: string}
        tipoEmpresa: {$ref: '#/components/schemas/TipoEmpresa'}
        direcciones:
          type: array
          items: {$ref: '#/components/schemas/DireccionRequest'}
        contactos:
          type: array
          items: {$ref: '#/components/schemas/ContactoRequest'}
        imagenIds:
          type: array
          items: {type: string, format: uuid}
          description: Fotos de sucursales (tipoImagen=SUCURSAL) y logo (tipoImagen=LOGO_EMPRESA).
      required: [razonSocial, cuit, tipoEmpresa]
    MayoristaResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        razonSocial: {type: string}
        cuit: {type: string}
        tipoEmpresa: {$ref: '#/components/schemas/TipoEmpresa'}
        direcciones:
          type: array
          items: {$ref: '#/components/schemas/DireccionResponse'}
        contactos:
          type: array
          items: {$ref: '#/components/schemas/ContactoResponse'}
        imagenIds:
          type: array
          items: {type: string, format: uuid}
    ConfiguracionCorreoMayoristaRequest:
      type: object
      properties:
        correo: {type: string, format: email}
        clave: {type: string, format: password}
        puerto: {type: string}
        smtp: {type: string}
        tls: {type: boolean}
      required: [correo, clave, puerto, smtp, tls]
    ConfiguracionCorreoMayoristaResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        correo: {type: string}
        puerto: {type: string}
        smtp: {type: string}
        tls: {type: boolean}
      description: Nunca devuelve la clave.
    ImagenResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        mime: {type: string}
        tipoImagen: {$ref: '#/components/schemas/TipoImagen'}
    PaisRequest:
      type: object
      properties:
        nombre: {type: string}
      required: [nombre]
    PaisResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
    ProvinciaRequest:
      type: object
      properties:
        nombre: {type: string}
        paisId: {type: string, format: uuid}
      required: [nombre, paisId]
    ProvinciaResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        paisId: {type: string, format: uuid}
    DepartamentoRequest:
      type: object
      properties:
        nombre: {type: string}
        provinciaId: {type: string, format: uuid}
      required: [nombre, provinciaId]
    DepartamentoResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        provinciaId: {type: string, format: uuid}
    LocalidadRequest:
      type: object
      properties:
        nombre: {type: string}
        codigoPostal: {type: string}
        departamentoId: {type: string, format: uuid}
      required: [nombre, departamentoId, codigoPostal]
    LocalidadResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        codigoPostal: {type: string}
        departamentoId: {type: string, format: uuid}
    CategoriaRequest:
      type: object
      properties:
        nombre: {type: string}
      required: [nombre]
    CategoriaResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
    SubCategoriaRequest:
      type: object
      properties:
        nombre: {type: string}
        categoriaId: {type: string, format: uuid}
      required: [nombre, categoriaId]
    SubCategoriaResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
