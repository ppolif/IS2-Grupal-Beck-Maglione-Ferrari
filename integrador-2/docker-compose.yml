
services:
  db:
    image: mysql:8.0
    container_name: dulcemayor-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    container_name: dulcemayor-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      APP_SEED_ENABLED: "true"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}

  frontend-admin:
    build: ./frontend-admin
    container_name: dulcemayor-admin
    restart: always
    ports:
      - "3000:80" # Nginx corre en el 80 internamente
    depends_on:
      - backend

  frontend-institucional:
    build: ./frontend-institucional
    container_name: dulcemayor-institucional
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

  frontend-preventor:
    build: ./frontend-preventor
    container_name: dulcemayor-preventor
    restart: always
    ports:
      - "3002:80"
    depends_on:
      - backend

volumes:
  db_data: