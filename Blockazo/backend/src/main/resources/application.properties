spring.application.name=blockazo-backend

server.port=${SERVER_PORT:8080}

spring.main.allow-circular-references=false

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:blockazo_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:blockazo_user}
spring.datasource.password=${MYSQL_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Seguridad JWT (sin valor por defecto para JWT_SECRET: debe fallar al arrancar si falta)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# CORS configurable por orígenes permitidos
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3005,http://localhost:5173,http://localhost:3001}

# Seed de usuarios iniciales (deshabilitado por defecto)
app.seed.enabled=${APP_SEED_ENABLED:false}

# Configuración de Auth0
auth0.domain=${AUTH0_DOMAIN:}

